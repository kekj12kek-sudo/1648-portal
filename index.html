<script>
(function () {
  const LOGIN_URL =
    "https://discord.com/oauth2/authorize?client_id=1514478819799470080&response_type=code&redirect_uri=https%3A%2F%2Fkekj12kek-sudo.github.io%2F1648-portal%2Fauth%2Fcallback%2F&scope=identify";

  const session = localStorage.getItem("discord_user");

  if (!session) {
    window.location.replace(LOGIN_URL);
    return;
  }

  try {
    const data = JSON.parse(session);

    if (!data.ok) {
      localStorage.removeItem("discord_user");
      window.location.replace(LOGIN_URL);
      return;
    }

    if (data.status === "pending_profile") {
      window.location.replace("/1648-portal/profile-setup/");
      return;
    }

    if (data.status !== "active") {
      localStorage.removeItem("discord_user");
      window.location.replace(LOGIN_URL);
      return;
    }
  } catch (e) {
    localStorage.removeItem("discord_user");
    window.location.replace(LOGIN_URL);
  }
})();
</script>

<script>
// ===== オープニング → HQ切り替え =====
const openingEl  = document.getElementById("opening");
const hqEl       = document.getElementById("hq");
const openingVid = document.getElementById("openingVideo");

function showHQ(){
  openingEl.classList.add("fade-out");
  hqEl.classList.add("visible");
  setTimeout(()=>{ openingEl.style.display="none"; }, 800);
}

let switched = false;
function doSwitch(){
  if(switched) return;
  switched = true;
  showHQ();
}

setTimeout(doSwitch, 3000);
openingVid.addEventListener("ended", doSwitch);
openingVid.addEventListener("error", doSwitch);

// ===== リンクボタン共通遷移 =====
function goLink(url, btn){
  addRippleToBtn(btn);
  setTimeout(()=>{ location.href = url; }, 250);
}

function goPortalLink(url, btn){
  sessionStorage.setItem("portal_entry", "1");
  goLink(url, btn);
}

// ===== 官職予約：モーション→遷移 =====
function goYoyaku(btn){
  addRippleToBtn(btn);
  const ov  = document.getElementById('yoyakuOpening');
  const vid = document.getElementById('yoyakuVideo');
  ov.classList.add('open');
  vid.currentTime = 0;
  vid.play().catch(()=>{});
  let gone = false;
  function go(){
    if(gone) return; gone = true;
    document.getElementById('hq').style.display = 'none';
    ov.classList.add('fade-out');
    setTimeout(()=>{ location.href = "https://kekj12kek-sudo.github.io/1648-yoyaku/"; }, 600);
  }
  vid.onended = go;
  setTimeout(go, 3500);
}

function addRippleToBtn(btn){
  if(!btn) return;
  const rect = btn.getBoundingClientRect();
  const ripple = document.createElement("div");
  ripple.className = "ripple";
  ripple.style.left = (rect.left + rect.width/2) + "px";
  ripple.style.top  = (rect.top  + rect.height/2) + "px";
  document.body.appendChild(ripple);
  setTimeout(()=>ripple.remove(), 500);
}

// ===== タップエリア =====
document.querySelectorAll('.tap-area').forEach(el=>{
  el.addEventListener('click', e=>{
    const url = el.dataset.url;
    if(!url) return;

    if(url.startsWith("/1648-portal/")){
      goPortalLink(url, null);
    }else{
      goLink(url, null);
    }
  });
});

// ===== ログインユーザー表示 / マイページUI =====
function getPortalSession(){
  try{
    const raw = localStorage.getItem("discord_user");
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){
    return null;
  }
}
function getPortalUserName(){
  const data = getPortalSession();
  const name =
    data?.user?.playerName ||
    data?.discord?.globalName ||
    data?.discord?.username ||
    data?.user?.discordName ||
    data?.globalName ||
    data?.discordName ||
    "メンバー";
  return name;
}
function getPortalAlliance(){
  const data = getPortalSession();
  return data?.user?.alliance || data?.user?.allianceName || data?.alliance || data?.allianceName || "";
}
function getPortalRoleKey(){
  const data = getPortalSession();
  const discordId = data?.user?.discordId || data?.discord?.id || data?.discordId || "";
  if(discordId === "795152243883114527") return "developer";
  return data?.role || data?.user?.role || "member";
}
function getRoleDisplayName(role){
  const map = {
    developer:"Developer",
    admin:"Admin",
    manager:"Manager",
    officer:"Officer",
    technical:"Technical",
    member:"Member"
  };
  return map[role] || "Member";
}
function getDisplayNameWithAlliance(){
  const name = getPortalUserName();
  const alliance = getPortalAlliance();
  return alliance ? `[${alliance}] ${name}` : name;
}
const PORTAL_FUNCTION_BASE = "https://us-central1-yoyaku-4ec7c.cloudfunctions.net";

function getPortalDiscordId(){
  const data = getPortalSession();
  return String(
    data?.user?.discordId ||
    data?.discord?.id ||
    data?.discordId ||
    ""
  ).trim();
}

function updateUnreadNotice(count){
  const unreadNotice = document.getElementById("unreadNotice");
  if(!unreadNotice) return;

  const n = Number(count || 0);
  if(Number.isFinite(n) && n > 0){
    unreadNotice.textContent = `🔔 未回答 ${n}件`;
    unreadNotice.classList.add("show");
  }else{
    unreadNotice.classList.remove("show");
  }
}

async function loadUnreadSurveyCount(){
  const discordId = getPortalDiscordId();
  if(!discordId){
    updateUnreadNotice(0);
    return;
  }

  try{
    const res = await fetch(`${PORTAL_FUNCTION_BASE}/getOpenSurveysForUser`, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({discordId})
    });

    const data = await res.json().catch(()=>({ok:false,error:"invalid_json"}));
    if(!res.ok || !data.ok) throw new Error(data.error || "getOpenSurveysForUser_failed");

    const list = Array.isArray(data.surveys) ? data.surveys : [];
    const unreadCount = list.filter(s => !s.answered).length;

    localStorage.setItem("portal_unanswered_count", String(unreadCount));
    updateUnreadNotice(unreadCount);
  }catch(e){
    console.warn("pending survey count load failed", e);

    // 通信失敗時は直前の件数を一時表示。なければ非表示。
    const cached = Number(localStorage.getItem("portal_unanswered_count") || "0");
    updateUnreadNotice(Number.isFinite(cached) ? cached : 0);
  }
}

function formatPortalDate(value){
  if(!value) return "";
  try{
    let d = null;
    if(typeof value === "string") d = new Date(value);
    else if(value._seconds) d = new Date(value._seconds * 1000);
    else if(value.seconds) d = new Date(value.seconds * 1000);
    else d = new Date(value);
    if(!d || Number.isNaN(d.getTime())) return "";
    const pad = n => String(n).padStart(2,"0");
    return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }catch(e){ return ""; }
}
function t12StageLabel(value){
  const map = {
    locked:"未解放",
    unlocked:"T12解放済",
    skill_1:"スキル1済",
    skill_2:"スキル2済",
    skill_3:"スキル3済",
    capacity_1:"容量1済",
    capacity_2:"容量2済",
    capacity_3:"容量3済",
    max:"カンスト"
  };
  return map[value] || value || "未保存";
}
function renderMyPageT12(progress){
  const area = document.getElementById("mypageT12Area");
  if(!area) return;
  if(!progress){
    area.className = "mypageMuted";
    area.textContent = "T12保存データはまだありません。";
    return;
  }
  const summary = progress.summary || {};
  const updated = formatPortalDate(progress.updatedAt) || progress.updatedAtText || "";
  area.className = "";
  area.innerHTML = `
    <div class="mypageDataLine"><span class="mypageDataLabel">盾</span><span class="mypageDataValue">${t12StageLabel(summary.shield)}</span></div>
    <div class="mypageDataLine"><span class="mypageDataLabel">槍</span><span class="mypageDataValue">${t12StageLabel(summary.spear)}</span></div>
    <div class="mypageDataLine"><span class="mypageDataLabel">弓</span><span class="mypageDataValue">${t12StageLabel(summary.bow)}</span></div>
    ${updated ? `<div class="mypageHistoryMeta">最終更新：${updated}</div>` : ""}
  `;
}
function renderMyPageSurveyHistory(history){
  const area = document.getElementById("mypageSurveyHistoryArea");
  if(!area) return;
  const list = Array.isArray(history) ? history : [];
  if(!list.length){
    area.className = "mypageMuted";
    area.textContent = "アンケート回答履歴はまだありません。";
    return;
  }
  area.className = "";
  area.innerHTML = list.slice(0,5).map(item => {
    const date = formatPortalDate(item.updatedAt || item.submittedAt);
    return `<div class="mypageHistoryItem">
      <div class="mypageHistoryTitle">${escapeHtml(item.title || "アンケート")}</div>
      <div class="mypageHistoryMeta">${date ? `回答：${date}` : "回答済み"}</div>
    </div>`;
  }).join("");
}
async function loadMyPageData(){
  const discordId = getPortalDiscordId();
  renderMyPageT12(null);
  renderMyPageSurveyHistory([]);
  if(!discordId) return;
  try{
    const res = await fetch(`${PORTAL_FUNCTION_BASE}/getMyPageData`, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({discordId})
    });
    const data = await res.json().catch(()=>({ok:false,error:"invalid_json"}));
    if(!res.ok || !data.ok) throw new Error(data.error || "getMyPageData_failed");
    renderMyPageT12(data.t12Progress || null);
    renderMyPageSurveyHistory(data.surveyHistory || []);
  }catch(e){
    console.warn("mypage data load failed", e);
    const t12Area = document.getElementById("mypageT12Area");
    const historyArea = document.getElementById("mypageSurveyHistoryArea");
    if(t12Area){ t12Area.className = "mypageMuted"; t12Area.textContent = "T12データを読み込めませんでした。"; }
    if(historyArea){ historyArea.className = "mypageMuted"; historyArea.textContent = "履歴を読み込めませんでした。"; }
  }
}
function escapeHtml(str){
  return String(str || "").replace(/[&<>\"']/g, s => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[s]));
}

function logoutPortal(){
  localStorage.removeItem("discord_user");
  localStorage.removeItem("discord_auth_code");
  location.href = "https://discord.com/oauth2/authorize?client_id=1514478819799470080&response_type=code&redirect_uri=https%3A%2F%2Fkekj12kek-sudo.github.io%2F1648-portal%2Fauth%2Fcallback%2F&scope=identify";
}
function initUserBadge(){
  const welcomeName = document.getElementById("welcomeName");
  const myPageBtn = document.getElementById("myPageBtn");
  const unreadNotice = document.getElementById("unreadNotice");
  const displayName = getDisplayNameWithAlliance();
  if(welcomeName){
    welcomeName.textContent = displayName;
  }
  if(unreadNotice){
    updateUnreadNotice(0);
    loadUnreadSurveyCount();
  }
  if(myPageBtn){
    myPageBtn.addEventListener("click", openMyPage);
  }
  const closeBtn = document.getElementById("mypageCloseBtn");
  if(closeBtn){
    closeBtn.addEventListener("click", closeMyPage);
  }
}
function openMyPage(){
  const overlay = document.getElementById("mypageOverlay");
  const playerName = document.getElementById("mypagePlayerName");
  const alliance = document.getElementById("mypageAlliance");
  const roleBox = document.getElementById("mypageRole");
  const adminNote = document.getElementById("adminPermissionNote");
  const role = getPortalRoleKey();
  if(playerName) playerName.textContent = getPortalUserName();
  if(alliance) alliance.textContent = getPortalAlliance() || "未設定";
  if(roleBox){
    roleBox.innerHTML = `<span class="roleBadgePopup role-${role}">${getRoleDisplayName(role)}</span>`;
  }
  if(adminNote){
    adminNote.classList.toggle("show", getPortalPermissionLevel() >= 1);
  }
  loadMyPageData();
  if(overlay) overlay.classList.add("open");
}
function closeMyPage(){
  document.getElementById("mypageOverlay")?.classList.remove("open");
}
function mypageOverlayClick(e){
  if(e.target && e.target.id === "mypageOverlay") closeMyPage();
}

// ===== 権限レベル判定（Discordロール連携まではKさんをdeveloper固定） =====
function getPortalPermissionLevel(){
  try{
    const raw = localStorage.getItem("discord_user");
    if(!raw) return 0;
    const data = JSON.parse(raw);
    const discordId =
      data?.user?.discordId ||
      data?.discord?.id ||
      data?.discordId ||
      "";

    if(discordId === "795152243883114527"){
      return 3; // HQディベロッパー
    }

    const role = data?.role || data?.user?.role || "member";
    const levelMap = {
      "developer": 3,
      "admin": 3,
      "manager": 2,
      "officer": 2,
      "technical": 1,
      "member": 0
    };

    return levelMap[role] ?? 0;
  }catch(e){
    return 0;
  }
}

function initAdminLink(){
  const adminLink = document.getElementById("adminFuture");
  if(!adminLink) return;
  const level = getPortalPermissionLevel();
  adminLink.style.display = level >= 1 ? "block" : "none";
}

document.addEventListener("DOMContentLoaded", () => {
  initUserBadge();
  initAdminLink();
});

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>1648 HQ</title>

<script>
(function () {
  const LOGIN_URL =
    "https://discord.com/oauth2/authorize?client_id=1514478819799470080&response_type=code&redirect_uri=https%3A%2F%2Fkekj12kek-sudo.github.io%2F1648-portal%2Fauth%2Fcallback%2F&scope=identify";

  const session = localStorage.getItem("discord_user");

  if (!session) {
    window.location.replace(LOGIN_URL);
    return;
  }

  try {
    const data = JSON.parse(session);

    if (!data.ok) {
      localStorage.removeItem("discord_user");
      window.location.replace(LOGIN_URL);
      return;
    }

    if (data.status === "pending_profile") {
      window.location.replace("/1648-portal/profile-setup/");
      return;
    }

    if (data.status !== "active") {
      localStorage.removeItem("discord_user");
      window.location.replace(LOGIN_URL);
      return;
    }
  } catch (e) {
    localStorage.removeItem("discord_user");
    window.location.replace(LOGIN_URL);
  }
})();
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000}

/* ===== オープニング ===== */
#opening{
  position:fixed;inset:0;z-index:100;background:#000;
  display:flex;align-items:center;justify-content:center;
}
#opening video{
  width:100%;height:100%;object-fit:cover;
}
#opening.fade-out{
  animation:fadeOut .8s ease forwards;
}
@keyframes fadeOut{
  from{opacity:1}
  to{opacity:0;pointer-events:none}
}

/* ===== メインHQ ===== */
#hq{
  position:fixed;inset:0;z-index:1;opacity:0;transition:opacity .8s ease;
}
#hq.visible{opacity:1}

/* 背景動画 */
#bgVideo{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  z-index:0;
}

/* タップエリア */
.tap-area{
  position:absolute;
  z-index:10;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.tap-area::after{
  content:"";
  position:absolute;inset:0;
  background:rgba(255,255,255,0);
  border-radius:8px;
  transition:background .15s;
}
.tap-area:active::after{
  background:rgba(255,255,255,.15);
}

/* 突撃くん */
#link-attack{
  left:0%;top:12%;
  width:42%;height:9%;
}

/* T12 promoter */
#link-t12{
  left:0%;top:21%;
  width:44%;height:9%;
}

/* タップリップル */
.ripple{
  position:fixed;
  width:60px;height:60px;
  border-radius:50%;
  background:rgba(255,255,255,.3);
  transform:translate(-50%,-50%) scale(0);
  animation:ripple .5s ease-out forwards;
  text-decoration:none;
  display:none;
  z-index:200;
}
@keyframes ripple{
  to{transform:translate(-50%,-50%) scale(4);opacity:0}
}

/* ===== リンクボタングループ ===== */
#link-buttons{
  position:fixed;
  top:84px;
  left:14px;
  transform:none;
  z-index:50;
  display:flex;
  flex-direction:column;
  gap:10px;
  width:min(360px, calc(100% - 28px));
  max-width:360px;
  align-items:stretch;
}
.link-btn{
  width:100%;
  height:52px;
  border-radius:14px;
  border:none;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 16px;
  cursor:pointer;
  font-family:'Hiragino Sans','Yu Gothic',sans-serif;
  font-weight:900;
  font-size:14px;
  letter-spacing:.5px;
  -webkit-tap-highlight-color:transparent;
  transition:transform .1s,box-shadow .1s;
}
.link-btn:active{transform:scale(.97);}
.link-btn-attack{
  background:linear-gradient(135deg,rgba(26,74,158,.92),rgba(13,45,110,.92));
  border:2px solid #3b82f6;
  color:#fff;
  box-shadow:0 4px 20px rgba(59,130,246,.4);
}
.link-btn-t12{
  background:linear-gradient(135deg,rgba(146,64,14,.92),rgba(107,48,8,.92));
  border:2px solid #f59e0b;
  color:#fde68a;
  box-shadow:0 4px 20px rgba(245,158,11,.4);
}
.link-btn-cost{
  background:linear-gradient(135deg,rgba(109,40,217,.92),rgba(76,29,149,.92));
  border:2px solid #a855f7;
  color:#e9d5ff;
  box-shadow:0 4px 20px rgba(168,85,247,.4);
}
.link-btn-yoyaku{
  background:linear-gradient(135deg,rgba(22,101,52,.92),rgba(15,70,35,.92));
  border:2px solid #22c55e;
  color:#86efac;
  box-shadow:0 4px 20px rgba(34,197,94,.4);
}
.link-btn-icon{width:36px;height:36px;flex-shrink:0;object-fit:contain;}
.link-btn-text{display:flex;flex-direction:column;line-height:1.3;text-align:left;}
.link-btn-main{font-size:14px;}
.link-btn-sub{font-size:9px;opacity:.75;font-weight:600;}

/* ===== 官職予約モーションオーバーレイ ===== */
#yoyakuOpening{
  display:none;
  position:fixed;inset:0;z-index:200;background:#000;
  align-items:center;justify-content:center;
}
#yoyakuOpening.open{display:flex;}
#yoyakuOpening video{
  width:100%;height:100%;object-fit:cover;
}
#yoyakuOpening.fade-out{
  animation:fadeOut .6s ease forwards;
}

/* ===== ログインユーザー表示 ===== */
#userBadge{
  position:fixed;
  top:12px;
  right:12px;
  z-index:80;
  display:flex;
  align-items:center;
  gap:8px;
  padding:9px 11px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.25);
  background:rgba(0,0,0,.62);
  color:#fff;
  font-family:'Hiragino Sans','Yu Gothic',sans-serif;
  font-size:12px;
  font-weight:800;
  backdrop-filter:blur(8px);
  box-shadow:0 4px 18px rgba(0,0,0,.35);
  max-width:min(340px, calc(100% - 28px));
}
#welcomeName{
  max-width:210px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
#logoutBtn{
  border:none;
  border-radius:999px;
  padding:5px 8px;
  background:rgba(255,255,255,.16);
  color:#fff;
  font-size:11px;
  font-weight:800;
  cursor:pointer;
}
#logoutBtn:active{transform:scale(.96);}
@media(max-width:480px){
  #link-buttons{
    top:76px;
    left:10px;
    width:calc(100% - 20px);
    max-width:340px;
  }
  #userBadge{
    top:8px;
    right:8px;
    font-size:11px;
    padding:8px 9px;
    max-width:calc(100% - 16px);
  }
  #welcomeName{max-width:178px;}
}

/* ===== 管理者ページリンク予定地 ===== */
#adminFuture{
  position:fixed;
  right:14px;
  bottom:14px;
  z-index:60;
  padding:9px 12px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(0,0,0,.45);
  color:rgba(255,255,255,.65);
  font-family:'Hiragino Sans','Yu Gothic',sans-serif;
  font-size:11px;
  font-weight:800;
  backdrop-filter:blur(8px);
  text-decoration:none;
  display:none;
}
@media(max-width:480px){
  #adminFuture{
    right:10px;
    bottom:10px;
    font-size:10px;
    padding:8px 10px;
  }
}

</style>
</head>
<body>
<!-- ログインユーザー表示 -->
<div id="userBadge">
  <span id="welcomeName">ようこそ</span>
  <button id="logoutBtn" type="button">ログアウト</button>
</div>

<!-- 管理者ページリンク -->
<a id="adminFuture" href="/1648-portal/admin/">管理者ページ</a>


<!-- 旧：官職予約モーションオーバーレイ（未使用・保守用） -->
<div id="yoyakuOpening">
  <video id="yoyakuVideo" playsinline muted>
    <source src="yoyaku_opening.mp4" type="video/mp4">
  </video>
</div>

<!-- オープニング（3秒） -->
<div id="opening">
  <video id="openingVideo" playsinline autoplay muted>
    <source src="opening.mp4" type="video/mp4">
  </video>
</div>

<!-- メインHQ -->
<div id="hq">
  <video id="bgVideo" playsinline autoplay muted loop>
    <source src="bg.mp4" type="video/mp4">
  </video>

  <!-- タップエリア：突撃くん -->
  <div class="tap-area" id="link-attack"
    data-url="https://kekj12kek-sudo.github.io/frost-dragon-app/frost_app.html">
  </div>

  <!-- タップエリア：T12 promoter -->
  <div class="tap-area" id="link-t12"
    data-url="/1648-portal/t12/">
  </div>
</div>

<!-- リンクボタングループ -->
<div id="link-buttons">
  <button class="link-btn link-btn-attack" onclick="goLink('https://kekj12kek-sudo.github.io/frost-dragon-app/frost_app.html', this)">
    <img class="link-btn-icon" src="usagi.png" alt="突撃くん">
    <span class="link-btn-text">
      <span class="link-btn-main">突撃くん</span>
      <span class="link-btn-sub">SVS・霜竜 同時着弾管理</span>
    </span>
  </button>
  <button class="link-btn link-btn-t12" onclick="goPortalLink('/1648-portal/t12/', this)">
    <img class="link-btn-icon" src="T12.png" alt="T12 Planner">
    <span class="link-btn-text">
      <span class="link-btn-main">T12 Planner</span>
      <span class="link-btn-sub">T12研究コスト計算</span>
    </span>
  </button>
  <button class="link-btn link-btn-cost" onclick="goLink('https://kekj12kek-sudo.github.io/wos-tools/', this)">
    <img class="link-btn-icon" src="cost_room_icon.png" alt="コスト計算room">
    <span class="link-btn-text">
      <span class="link-btn-main">コスト計算room</span>
      <span class="link-btn-sub">宝石・装備 育成コスト計算</span>
    </span>
  </button>
  <button class="link-btn link-btn-yoyaku" onclick="goPortalLink('/1648-portal/survey/', this)">
    <img class="link-btn-icon" src="EXPRESS.png" alt="アンケートRoom">
    <span class="link-btn-text">
      <span class="link-btn-main">アンケートRoom</span>
      <span class="link-btn-sub">戦力調査・官職予約</span>
    </span>
  </button>
</div>

<script>
// ===== オープニング → HQ切り替え =====
const openingEl  = document.getElementById("opening");
const hqEl       = document.getElementById("hq");
const openingVid = document.getElementById("openingVideo");

function showHQ(){
  openingEl.classList.add("fade-out");
  hqEl.classList.add("visible");
  setTimeout(()=>{ openingEl.style.display="none"; }, 800);
}

let switched = false;
function doSwitch(){
  if(switched) return;
  switched = true;
  showHQ();
}

setTimeout(doSwitch, 3000);
openingVid.addEventListener("ended", doSwitch);
openingVid.addEventListener("error", doSwitch);

// ===== リンクボタン共通遷移 =====
function goLink(url, btn){
  addRippleToBtn(btn);
  setTimeout(()=>{ location.href = url; }, 250);
}

function goPortalLink(url, btn){
  sessionStorage.setItem("portal_entry", "1");
  goLink(url, btn);
}

// ===== 旧：官職予約モーション→遷移（未使用・保守用） =====
function goYoyaku(btn){
  addRippleToBtn(btn);
  const ov  = document.getElementById('yoyakuOpening');
  const vid = document.getElementById('yoyakuVideo');
  ov.classList.add('open');
  vid.currentTime = 0;
  vid.play().catch(()=>{});
  let gone = false;
  function go(){
    if(gone) return; gone = true;
    document.getElementById('hq').style.display = 'none';
    ov.classList.add('fade-out');
    setTimeout(()=>{ location.href = "https://kekj12kek-sudo.github.io/1648-yoyaku/"; }, 600);
  }
  vid.onended = go;
  setTimeout(go, 3500);
}

function addRippleToBtn(btn){
  if(!btn) return;
  const rect = btn.getBoundingClientRect();
  const ripple = document.createElement("div");
  ripple.className = "ripple";
  ripple.style.left = (rect.left + rect.width/2) + "px";
  ripple.style.top  = (rect.top  + rect.height/2) + "px";
  document.body.appendChild(ripple);
  setTimeout(()=>ripple.remove(), 500);
}

// ===== タップエリア =====
document.querySelectorAll('.tap-area').forEach(el=>{
  el.addEventListener('click', e=>{
    const url = el.dataset.url;
    if(!url) return;
    if(url.startsWith("/1648-portal/")){
      goPortalLink(url, null);
    }else{
      goLink(url, null);
    }
  });
});

// ===== ログインユーザー表示 =====
function getPortalUserName(){
  try{
    const raw = localStorage.getItem("discord_user");
    if(!raw) return "";
    const data = JSON.parse(raw);
    const name =
      data?.user?.playerName ||
      data?.discord?.globalName ||
      data?.discord?.username ||
      data?.user?.discordName ||
      data?.globalName ||
      data?.discordName ||
      "メンバー";
    return name;
  }catch(e){
    return "メンバー";
  }
}

function initUserBadge(){
  const welcomeName = document.getElementById("welcomeName");
  const logoutBtn = document.getElementById("logoutBtn");
  const name = getPortalUserName();
  if(welcomeName){
    welcomeName.textContent = `ようこそ ${name}さん`;
  }
  if(logoutBtn){
    logoutBtn.addEventListener("click", () => {
      localStorage.removeItem("discord_user");
      localStorage.removeItem("discord_auth_code");
      location.href = "https://discord.com/oauth2/authorize?client_id=1514478819799470080&response_type=code&redirect_uri=https%3A%2F%2Fkekj12kek-sudo.github.io%2F1648-portal%2Fauth%2Fcallback%2F&scope=identify";
    });
  }
}


// ===== 権限レベル判定（Discordロール連携まではKさんをdeveloper固定） =====
function getPortalPermissionLevel(){
  try{
    const raw = localStorage.getItem("discord_user");
    if(!raw) return 0;
    const data = JSON.parse(raw);
    const discordId =
      data?.user?.discordId ||
      data?.discord?.id ||
      data?.discordId ||
      "";

    if(discordId === "795152243883114527"){
      return 3; // HQディベロッパー
    }

    const role = data?.role || data?.user?.role || "member";
    const levelMap = {
      "developer": 3,
      "manager": 2,
      "technical": 1,
      "member": 0
    };

    return levelMap[role] ?? 0;
  }catch(e){
    return 0;
  }
}

function initAdminLink(){
  const adminLink = document.getElementById("adminFuture");
  if(!adminLink) return;
  const level = getPortalPermissionLevel();
  adminLink.style.display = level >= 1 ? "block" : "none";
}

document.addEventListener("DOMContentLoaded", () => {
  initUserBadge();
  initAdminLink();
});

</script>
</body>
</html>

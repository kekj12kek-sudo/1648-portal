<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>都市マーカー座標ピッカー</title>
<style>
  :root{
    --bg:#0d1117; --bg2:#161b22; --bg3:#1c2230; --border:#2a3142;
    --text:#e6edf3; --text2:#8b949e; --accent:#58a6ff; --green:#3fb950; --orange:#f0883e; --red:#f85149;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:16px}
  h1{font-size:18px;margin:0 0 4px}
  .sub{color:var(--text2);font-size:13px;margin-bottom:16px}
  .panel{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  label{font-size:12px;color:var(--text2)}
  select,input[type=text],input[type=number]{background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 10px;font-size:13px}
  select{min-width:160px}
  button{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer}
  button.sec{background:var(--bg3);border:1px solid var(--border);color:var(--text)}
  button.danger{background:var(--red)}
  button:hover{opacity:.88}
  button:active{opacity:.7}
  .map-wrap{position:relative;width:100%;max-width:720px;margin:0 auto;border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:crosshair;background:#000}
  .map-wrap img{width:100%;display:block;pointer-events:none;user-select:none}
  .dot{position:absolute;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;border:2px solid var(--accent);background:rgba(31,111,235,.55);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;text-shadow:0 1px 2px #000;cursor:grab}
  .dot.dragging{cursor:grabbing;z-index:5;box-shadow:0 0 0 3px rgba(255,255,255,.5)}
  .city-list{display:flex;flex-direction:column;gap:6px;margin-top:12px}
  .city-row{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12px}
  .city-row .idx{width:20px;font-weight:800;color:var(--accent)}
  .city-row input{width:70px}
  .city-row .del{margin-left:auto;background:transparent;border:none;color:var(--red);cursor:pointer;font-size:14px;padding:2px 6px}
  .out{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px;font-family:Menlo,Consolas,monospace;font-size:12px;white-space:pre-wrap;word-break:break-all;max-height:260px;overflow:auto;color:#9ecbff}
  .badge{display:inline-block;background:var(--bg3);border:1px solid var(--border);border-radius:5px;padding:2px 8px;font-size:11px;color:var(--text2)}
  .hint{font-size:12px;color:var(--text2);margin-top:6px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:8px 18px;border-radius:18px;font-size:13px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50}
</style>
</head>
<body>

<h1>都市マーカー座標ピッカー</h1>
<div class="sub">マップ画像をクリックすると都市マーカーが置かれます。ドラッグで微調整、ダブルクリックで削除。完了したら下のコードをコピーしてFIXED_POSに貼り付けてください。</div>

<div class="panel">
  <div class="row">
    <label>画像の場所：</label>
    <select id="srcMode">
      <option value="url">URLから読み込み（GitHub Pages）</option>
      <option value="local">ローカルファイルを選択</option>
    </select>
    <input type="file" id="fileInput" accept="image/*" style="display:none">
  </div>
  <div class="row" id="urlRow">
    <label>ベースURL：</label>
    <input type="text" id="baseUrl" value="https://kekj12kek-sudo.github.io/1648-portal/raid/images/" style="width:380px">
  </div>
  <div class="row">
    <label>パターン：</label>
    <select id="patternSelect"></select>
    <span class="badge" id="fileNameBadge"></span>
    <button class="sec" id="loadBtn">この画像を読み込む</button>
  </div>
  <div class="row">
    <label>都市数：</label>
    <select id="cityCount">
      <option value="6">6都市</option>
      <option value="5">5都市</option>
    </select>
    <button id="resetDotsBtn" class="sec">マーカーをリセット</button>
    <span class="hint" id="loadedHint"></span>
  </div>
</div>

<div class="panel">
  <div class="map-wrap" id="mapWrap">
    <div style="padding:60px;text-align:center;color:var(--text2)">上の「この画像を読み込む」を押してください</div>
  </div>
</div>

<div class="panel">
  <div class="row" style="justify-content:space-between">
    <strong style="font-size:13px">配置した都市座標（クリック順 = 都市1, 2, 3...）</strong>
    <button class="sec" id="copyBtn">コードをコピー</button>
  </div>
  <div class="city-list" id="cityList"></div>
  <div class="hint">数値欄を直接編集しても反映されます（Enterで確定）。</div>
</div>

<div class="panel">
  <div class="row" style="justify-content:space-between">
    <strong style="font-size:13px">FIXED_POS 用コード（このパターンだけ）</strong>
  </div>
  <div class="out" id="codeOut">（まだ座標がありません）</div>
</div>

<div class="panel">
  <div class="row" style="justify-content:space-between">
    <strong style="font-size:13px">全パターンまとめ（作業した分だけ蓄積されます）</strong>
    <div style="display:flex;gap:6px">
      <button class="sec" id="copyAllBtn">全パターンコードをコピー</button>
      <button class="danger" id="clearAllBtn">全パターンをクリア</button>
    </div>
  </div>
  <div class="out" id="codeOutAll">（まだ保存されたパターンがありません）</div>
</div>

<div class="toast" id="toast"></div>

<script>
const PATTERNS = [
  {key:'lr_blue_A_6', label:'左右分け / 青 / Aエリア / 6都市', file:'左右分け青左上.jpg'},
  {key:'lr_blue_A_5', label:'左右分け / 青 / Aエリア / 5都市', file:'左右分け青左上.jpg'},
  {key:'lr_blue_B_6', label:'左右分け / 青 / Bエリア / 6都市', file:'左右分け青左下.jpg'},
  {key:'lr_blue_B_5', label:'左右分け / 青 / Bエリア / 5都市', file:'左右分け青左下.jpg'},
  {key:'lr_red_A_6',  label:'左右分け / 赤 / Aエリア / 6都市', file:'左右分け赤右上.jpg'},
  {key:'lr_red_A_5',  label:'左右分け / 赤 / Aエリア / 5都市', file:'左右分け赤右上.jpg'},
  {key:'lr_red_B_6',  label:'左右分け / 赤 / Bエリア / 6都市', file:'左右分け赤右下.jpg'},
  {key:'lr_red_B_5',  label:'左右分け / 赤 / Bエリア / 5都市', file:'左右分け赤右下.jpg'},
  {key:'ud_blue_A_6', label:'上下分け / 青 / Aエリア / 6都市', file:'上下分け青左上.jpg'},
  {key:'ud_blue_A_5', label:'上下分け / 青 / Aエリア / 5都市', file:'上下分け青左上.jpg'},
  {key:'ud_blue_B_6', label:'上下分け / 青 / Bエリア / 6都市', file:'上下分け青右上.jpg'},
  {key:'ud_blue_B_5', label:'上下分け / 青 / Bエリア / 5都市', file:'上下分け青右上.jpg'},
  {key:'ud_red_A_6',  label:'上下分け / 赤 / Aエリア / 6都市', file:'上下分け赤左下.jpg'},
  {key:'ud_red_A_5',  label:'上下分け / 赤 / Aエリア / 5都市', file:'上下分け赤左下.jpg'},
  {key:'ud_red_B_6',  label:'上下分け / 赤 / Bエリア / 6都市', file:'上下分け赤右下.jpg'},
  {key:'ud_red_B_5',  label:'上下分け / 赤 / Bエリア / 5都市', file:'上下分け赤右下.jpg'},
];

let dots = []; // {x, y} in percent
let currentKey = null;
let draggingIdx = null;
let savedPatterns = {}; // key -> [{x,y}, ...]

const patternSelect = document.getElementById('patternSelect');
const srcMode = document.getElementById('srcMode');
const urlRow = document.getElementById('urlRow');
const fileInput = document.getElementById('fileInput');
const baseUrl = document.getElementById('baseUrl');
const mapWrap = document.getElementById('mapWrap');
const cityList = document.getElementById('cityList');
const codeOut = document.getElementById('codeOut');
const codeOutAll = document.getElementById('codeOutAll');
const fileNameBadge = document.getElementById('fileNameBadge');
const loadedHint = document.getElementById('loadedHint');
const cityCountSel = document.getElementById('cityCount');

PATTERNS.forEach(p=>{
  const opt = document.createElement('option');
  opt.value = p.key;
  opt.textContent = p.label;
  patternSelect.appendChild(opt);
});

function syncCityCountFromKey(){
  const p = PATTERNS.find(x=>x.key===patternSelect.value);
  if(!p) return;
  cityCountSel.value = p.key.endsWith('_6') ? '6' : '5';
  fileNameBadge.textContent = p.file;
}
patternSelect.addEventListener('change', syncCityCountFromKey);
syncCityCountFromKey();

srcMode.addEventListener('change', ()=>{
  urlRow.style.display = srcMode.value==='url' ? 'flex' : 'none';
});

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>{ t.style.opacity='0'; }, 1600);
}

function saveCurrentPattern(){
  if(currentKey && dots.length>0){
    savedPatterns[currentKey] = dots.slice();
  }
}

document.getElementById('loadBtn').addEventListener('click', ()=>{
  saveCurrentPattern(); // 切替前のパターンを保存
  const p = PATTERNS.find(x=>x.key===patternSelect.value);
  if(!p) return;
  currentKey = p.key;
  dots = (savedPatterns[currentKey] ? savedPatterns[currentKey].slice() : []);

  if(srcMode.value==='local'){
    fileInput.onchange = (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (ev)=> renderMap(ev.target.result);
      reader.readAsDataURL(file);
    };
    fileInput.click();
  } else {
    const url = baseUrl.value.replace(/\/+$/,'/') + encodeURIComponent(p.file);
    renderMap(url);
  }
  loadedHint.textContent = `読み込み中パターン: ${p.key}（都市${p.key.endsWith('_6')?6:5}）`;
});

function renderMap(src){
  mapWrap.innerHTML = '';
  const img = document.createElement('img');
  img.src = src;
  img.draggable = false;
  img.onerror = ()=> { mapWrap.innerHTML = '<div style="padding:40px;text-align:center;color:var(--red)">画像を読み込めませんでした。URLまたはファイルを確認してください。</div>'; };
  mapWrap.appendChild(img);
  redrawDots();
  mapWrap.addEventListener('click', onMapClick);
}

function onMapClick(e){
  if(draggingIdx !== null) return;
  if(e.target.classList && e.target.classList.contains('dot')) return;
  const rect = mapWrap.getBoundingClientRect();
  const x = ((e.clientX - rect.left) / rect.width) * 100;
  const y = ((e.clientY - rect.top) / rect.height) * 100;
  const max = parseInt(cityCountSel.value);
  if(dots.length >= max){
    toast(`都市数は${max}までです。マーカーをリセットするか既存を編集してください`);
    return;
  }
  dots.push({x: round2(x), y: round2(y)});
  redrawDots();
}

function round2(n){ return Math.round(n*100)/100; }

function redrawDots(){
  [...mapWrap.querySelectorAll('.dot')].forEach(d=>d.remove());
  dots.forEach((d,i)=>{
    const el = document.createElement('div');
    el.className = 'dot';
    el.style.left = d.x + '%';
    el.style.top = d.y + '%';
    el.textContent = i+1;
    el.addEventListener('mousedown', (ev)=> startDrag(ev, i));
    el.addEventListener('dblclick', (ev)=>{
      ev.stopPropagation();
      dots.splice(i,1);
      redrawDots();
    });
    mapWrap.appendChild(el);
  });
  renderCityList();
  renderCode();
  renderAllCode();
}

function startDrag(e, idx){
  e.preventDefault();
  e.stopPropagation();
  draggingIdx = idx;
  const dotEl = e.target;
  dotEl.classList.add('dragging');
  function onMove(ev){
    const rect = mapWrap.getBoundingClientRect();
    let x = ((ev.clientX - rect.left) / rect.width) * 100;
    let y = ((ev.clientY - rect.top) / rect.height) * 100;
    x = Math.max(0, Math.min(100, x));
    y = Math.max(0, Math.min(100, y));
    dots[idx] = {x: round2(x), y: round2(y)};
    dotEl.style.left = dots[idx].x + '%';
    dotEl.style.top = dots[idx].y + '%';
    renderCityList();
    renderCode();
  }
  function onUp(){
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    dotEl.classList.remove('dragging');
    renderAllCode();
    setTimeout(()=>{ draggingIdx = null; }, 50);
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

function renderCityList(){
  cityList.innerHTML = '';
  dots.forEach((d,i)=>{
    const row = document.createElement('div');
    row.className = 'city-row';
    row.innerHTML = `
      <span class="idx">${i+1}</span>
      <label>x:</label><input type="number" step="0.01" value="${d.x}" data-i="${i}" data-axis="x">
      <label>y:</label><input type="number" step="0.01" value="${d.y}" data-i="${i}" data-axis="y">
      <button class="del" data-i="${i}">✕ 削除</button>
    `;
    cityList.appendChild(row);
  });
  cityList.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('change', (e)=>{
      const i = parseInt(e.target.dataset.i);
      const axis = e.target.dataset.axis;
      dots[i][axis] = parseFloat(e.target.value)||0;
      redrawDots();
    });
  });
  cityList.querySelectorAll('.del').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      const i = parseInt(e.target.dataset.i);
      dots.splice(i,1);
      redrawDots();
    });
  });
}

function currentCodeLine(){
  if(!currentKey || dots.length===0) return null;
  const arr = dots.map(d=>`{"x":${d.x},"y":${d.y}}`).join(',');
  return `  '${currentKey}':[${arr}],`;
}

function renderCode(){
  const line = currentCodeLine();
  codeOut.textContent = line || '（まだ座標がありません）';
}

document.getElementById('copyBtn').addEventListener('click', ()=>{
  const line = currentCodeLine();
  if(!line){ toast('座標がありません'); return; }
  navigator.clipboard.writeText(line.trim());
  toast('コピーしました');
});

document.getElementById('resetDotsBtn').addEventListener('click', ()=>{
  dots = [];
  redrawDots();
});

function renderAllCode(){
  const tmp = Object.assign({}, savedPatterns);
  if(currentKey && dots.length>0) tmp[currentKey] = dots;
  const keys = Object.keys(tmp);
  if(keys.length===0){ codeOutAll.textContent = '（まだ保存されたパターンがありません）'; return; }
  const lines = keys.map(k=>{
    const arr = tmp[k].map(d=>`{"x":${d.x},"y":${d.y}}`).join(',');
    return `  '${k}':[${arr}],`;
  });
  codeOutAll.textContent = 'const FIXED_POS={\n' + lines.join('\n') + '\n};';
}

document.getElementById('copyAllBtn').addEventListener('click', ()=>{
  saveCurrentPattern();
  renderAllCode();
  navigator.clipboard.writeText(codeOutAll.textContent);
  toast('全パターンコードをコピーしました');
});

document.getElementById('clearAllBtn').addEventListener('click', ()=>{
  if(!confirm('全パターンのデータを消去します。よろしいですか？')) return;
  savedPatterns = {};
  renderAllCode();
});
</script>

</body>
</html>

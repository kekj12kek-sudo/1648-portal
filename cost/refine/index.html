<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>コスト計算room</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%}
body{overflow:hidden;font-family:"Segoe UI",sans-serif;background:#000;color:#fff}
video.bg-video{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:-1}

.menu{
  position:absolute;left:15px;top:calc(env(safe-area-inset-top, 0px) + 92px);
  width:calc(100% - 30px);max-width:280px;
  display:flex;flex-direction:column;gap:8px
}
.logo{
  color:white;font-size:22px;font-weight:900;margin-bottom:8px;
  text-shadow:0 0 10px rgba(255,255,255,.6),0 0 20px rgba(255,255,255,.4)
}
.menu a.tool-link{
  text-decoration:none;color:white;padding:11px 14px;border-radius:12px;
  background:rgba(8,25,45,.55);backdrop-filter:blur(8px);
  border:1px solid rgba(120,212,255,.2);transition:.2s;
  -webkit-tap-highlight-color:transparent
}
.menu a.tool-link:active{transform:translateX(4px);border-color:#ffc34a}
@media(hover:hover){.menu a.tool-link:hover{transform:translateX(5px);border-color:#ffc34a}}
.title{font-size:16px;font-weight:800}
.desc{margin-top:3px;font-size:11px;color:#b8dfff;opacity:.8;line-height:1.35}

/* 精錬火晶計画カード — アクセントカラー */
a.tool-link.refine-link{
  border-color:rgba(255,100,40,.28);
  background:rgba(25,10,5,.55);
}
a.tool-link.refine-link:active{border-color:#ff7a30}
@media(hover:hover){a.tool-link.refine-link:hover{border-color:#ff7a30}}
a.tool-link.refine-link .title{color:#ffb07a}
a.tool-link.refine-link .desc{color:#ffd4bb;opacity:.82}

.home-btn{
  display:flex;align-items:center;justify-content:center;gap:6px;
  margin-top:4px;text-decoration:none;color:rgba(255,255,255,.75);
  font-size:13px;font-weight:700;padding:11px 14px;border-radius:12px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);
  backdrop-filter:blur(8px);transition:.2s;-webkit-tap-highlight-color:transparent
}
.home-btn:active,.home-btn:hover{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.35)}

.transition-layer{
  position:fixed;inset:0;z-index:100000;display:none;background:#000;
  align-items:center;justify-content:center;opacity:0;transition:opacity .25s ease
}
.transition-layer.show{display:flex;opacity:1}
.transition-layer.fadeout{opacity:0}
.transition-layer video{width:100%;height:100%;object-fit:cover}
.transition-caption{
  position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);
  text-align:center;font-size:13px;font-weight:900;color:rgba(255,255,255,.9);
  text-shadow:0 0 12px rgba(0,0,0,.9)
}

.portal-bottom-back{
  position:fixed;left:10px;bottom:calc(env(safe-area-inset-bottom, 0px) + 10px);
  z-index:99999;min-height:38px;padding:0 14px;border-radius:999px;
  border:1px solid rgba(255,255,255,.28);background:rgba(0,0,0,.72);
  color:#fff;text-decoration:none;font-size:12px;font-weight:900;
  display:inline-flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;backdrop-filter:blur(8px);
  box-shadow:0 8px 24px rgba(0,0,0,.35)
}
.portal-bottom-back:active{transform:scale(.96)}
body{padding-bottom:calc(env(safe-area-inset-bottom, 0px) + 54px)}
</style>
<script>
(function(){
  const LOGIN_URL="https://discord.com/oauth2/authorize?client_id=1514478819799470080&response_type=code&redirect_uri=https%3A%2F%2Fkekj12kek-sudo.github.io%2F1648-portal%2Fauth%2Fcallback%2F&scope=identify";
  const PROFILE_SETUP_URL="/1648-portal/profile-setup/";
  try{
    const raw=localStorage.getItem("discord_user");
    if(!raw){ location.replace(LOGIN_URL); return; }
    const data=JSON.parse(raw);
    if(!data || data.ok!==true){ localStorage.removeItem("discord_user"); location.replace(LOGIN_URL); return; }
    if(data.status==="pending_profile"){ location.replace(PROFILE_SETUP_URL); return; }
    if(data.status!=="active"){ localStorage.removeItem("discord_user"); location.replace(LOGIN_URL); return; }
    sessionStorage.setItem("portal_entry","1");
  }catch(e){
    localStorage.removeItem("discord_user");
    location.replace(LOGIN_URL);
  }
})();
</script>
</head>
<body>
<video class="bg-video" autoplay muted loop playsinline>
  <source src="background.mp4" type="video/mp4">
</video>
<div class="overlay"></div>

<div class="menu">
  <div class="logo">コスト計算room</div>

  <a class="tool-link" href="./wos-hero-gear-planner/">
    <div class="title">英雄装備コスト計算</div>
    <div class="desc">神話装備・精錬鍛造・配能計算</div>
  </a>

  <a class="tool-link" href="./wos-lord-gem-planner/">
    <div class="title">宝石・領主装備コスト計算</div>
    <div class="desc">宝石LvUP・領主装備強化</div>
  </a>

  <a class="tool-link refine-link" href="./refine/" id="refineLink">
    <div class="title">精錬火晶計画</div>
    <div class="desc">手持ち火晶・目標精錬火晶から期間と必要数を計算</div>
  </a>

  <a class="home-btn" href="/1648-portal/">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M1.5 6L7 1.5L12.5 6V13H9V9H5V13H1.5V6Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" fill="none"/>
    </svg>
    ポータルへ戻る
  </a>
</div>

<div class="transition-layer" id="transitionLayer" aria-hidden="true">
  <video id="transitionVideo" muted playsinline preload="auto">
    <source src="refine-transition.mp4" type="video/mp4">
  </video>
  <div class="transition-caption">精錬火晶計画へ移動中</div>
</div>

<script>
(function(){
  const link=document.getElementById("refineLink");
  const layer=document.getElementById("transitionLayer");
  const video=document.getElementById("transitionVideo");
  let moving=false;

  function goRefine(){
    sessionStorage.setItem("refine_plan_entry","1");
    location.href="./refine/";
  }

  link.addEventListener("click",function(e){
    e.preventDefault();
    if(moving) return;
    moving=true;
    sessionStorage.setItem("refine_plan_entry","1");
    layer.classList.add("show");
    try{ video.currentTime=0; }catch(err){}
    const fallback=setTimeout(goRefine,3400);
    video.onended=function(){
      clearTimeout(fallback);
      goRefine();
    };
    const p=video.play();
    if(p && typeof p.catch==="function"){
      p.catch(function(){ clearTimeout(fallback); goRefine(); });
    }
  });
})();
</script>
</body>
</html>

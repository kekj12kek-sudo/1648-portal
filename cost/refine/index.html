<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>精錬火晶計画</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100%}
body{
  font-family:"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;
  color:#fff;background:#05080d;
  min-height:100vh;overflow-x:hidden;overflow-y:auto;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 72px)
}
body::before{
  content:"";position:fixed;inset:0;z-index:-3;
  background:url("./refine-bg.jpg") center center/cover no-repeat;
}
body::after{content:"";position:fixed;inset:0;z-index:-2;background:rgba(0,0,0,.50)}
.page{width:100%;max-width:420px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 14px 24px}
.header{margin-bottom:10px}
.logo{font-size:22px;font-weight:900;letter-spacing:.03em;text-shadow:0 0 14px rgba(255,120,40,.75),0 0 28px rgba(255,60,10,.35)}
.sub{margin-top:5px;font-size:12px;color:rgba(255,220,190,.78);line-height:1.5}
.refine-visual{
  width:100%;display:block;border-radius:16px;margin:12px 0 14px;
  box-shadow:0 12px 36px rgba(0,0,0,.55),0 0 24px rgba(255,80,20,.18);
  border:1px solid rgba(255,120,40,.38);background:rgba(0,0,0,.3);
}
.card{
  background:rgba(6,14,28,.70);border:1px solid rgba(255,120,40,.22);
  border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.45);
  backdrop-filter:blur(12px);padding:14px
}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.tab-btn{
  border:1px solid rgba(255,255,255,.18);border-radius:13px;padding:10px 8px;
  background:rgba(255,255,255,.07);color:rgba(255,255,255,.75);
  font-size:13px;font-weight:900;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:background .15s,border-color .15s
}
.tab-btn.active{
  background:linear-gradient(135deg,rgba(255,120,40,.92),rgba(220,60,10,.88));
  color:#fff;border-color:rgba(255,180,100,.7);box-shadow:0 0 18px rgba(255,90,20,.3)
}
.panel{display:none}.panel.active{display:block}
.field{margin:10px 0 12px}
label{display:block;font-size:12px;font-weight:900;color:#ffd4b0;margin-bottom:6px}
input[type=number]{
  width:100%;height:44px;border-radius:12px;
  border:1px solid rgba(255,140,60,.30);
  background:rgba(0,0,0,.40);color:#fff;
  font-size:18px;font-weight:900;padding:0 12px;outline:none;
  -moz-appearance:textfield;
}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
input[type=number]:focus{border-color:#ff8c30;box-shadow:0 0 0 3px rgba(255,120,40,.18)}
.lack-box{
  margin:8px 0 10px;padding:9px 12px;border-radius:12px;
  background:rgba(255,80,10,.10);border:1px solid rgba(255,140,60,.22);
  display:flex;align-items:center;justify-content:space-between;gap:10px
}
.lack-box span:first-child{font-size:12px;color:rgba(255,220,180,.78);font-weight:900}
.lack-box span:last-child{font-size:18px;color:#ffb87a;font-weight:1000}
.notice{
  margin:10px 0 12px;padding:10px 11px;border-radius:13px;
  background:rgba(255,160,50,.10);border:1px solid rgba(255,200,100,.28);
  color:rgba(255,240,210,.90);font-size:12px;line-height:1.6
}
.notice-title{font-weight:900;margin-bottom:3px}
.result-title{font-size:13px;font-weight:900;margin:12px 0 8px;color:#ffd4b0}
.table-wrap{width:100%;overflow-x:auto;border-radius:13px;border:1px solid rgba(255,255,255,.13)}
table{width:100%;border-collapse:collapse;background:rgba(0,0,0,.22);min-width:340px}
th,td{padding:9px 8px;border-bottom:1px solid rgba(255,255,255,.09);font-size:12px;text-align:right;white-space:nowrap}
th{background:rgba(255,80,20,.15);color:#ffcfa0;font-size:11px;font-weight:900}
th:first-child,td:first-child{text-align:left;font-weight:900;color:#fff}
tr:last-child td{border-bottom:none}
tr:nth-child(even) td{background:rgba(255,255,255,.03)}
.empty{color:rgba(255,255,255,.38)}
.row-disabled td{color:rgba(255,255,255,.28)!important;font-weight:400!important}
.insufficient{text-align:left!important;font-size:11px;color:rgba(255,255,255,.28)!important;font-weight:400!important}
.back-btn{
  position:fixed;left:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);
  z-index:9999;min-height:38px;padding:0 14px;border-radius:999px;
  border:1px solid rgba(255,255,255,.28);background:rgba(0,0,0,.75);
  color:#fff;text-decoration:none;font-size:12px;font-weight:900;
  display:inline-flex;align-items:center;justify-content:center;
  backdrop-filter:blur(8px);box-shadow:0 8px 24px rgba(0,0,0,.40);
  -webkit-tap-highlight-color:transparent
}
.back-btn:active{transform:scale(.96)}
@media(max-width:360px){
  .logo{font-size:20px}
  th,td{padding:8px 6px;font-size:11px}
  .tab-btn{font-size:12px}
}
</style>
<script>
(function(){
  const LOGIN_URL="https://discord.com/oauth2/authorize?client_id=1514478819799470080&response_type=code&redirect_uri=https%3A%2F%2Fkekj12kek-sudo.github.io%2F1648-portal%2Fauth%2Fcallback%2F&scope=identify";
  const PROFILE_SETUP_URL="/1648-portal/profile-setup/";
  const COST_URL="/1648-portal/cost/";
  try{
    const raw=localStorage.getItem("discord_user");
    if(!raw){ location.replace(LOGIN_URL); return; }
    const data=JSON.parse(raw);
    if(!data||data.ok!==true){ localStorage.removeItem("discord_user"); location.replace(LOGIN_URL); return; }
    if(data.status==="pending_profile"){ location.replace(PROFILE_SETUP_URL); return; }
    if(data.status!=="active"){ localStorage.removeItem("discord_user"); location.replace(LOGIN_URL); return; }
    if(sessionStorage.getItem("portal_entry")!=="1"||sessionStorage.getItem("refine_plan_entry")!=="1"){
      location.replace(COST_URL); return;
    }
  }catch(e){ localStorage.removeItem("discord_user"); location.replace(LOGIN_URL); }
})();
</script>
</head>
<body>
<div class="page">
  <header class="header">
    <div class="logo">🔥 精錬火晶計画</div>
    <div class="sub">手持ち火晶から作れる数、目標までの期間と必要火晶を確認できます。</div>
  </header>

  <img src="./refine-ui.jpg" alt="火晶精製装置" class="refine-visual">

  <main class="card">
    <div class="tabs" role="tablist">
      <button class="tab-btn active" type="button" data-tab="owned">手持ち火晶</button>
      <button class="tab-btn" type="button" data-tab="target">必要精錬火晶</button>
    </div>

    <!-- タブ①：手持ち火晶 -->
    <section class="panel active" id="panel-owned">
      <div class="field">
        <label for="ownedCrystal">保有火晶</label>
        <input id="ownedCrystal" type="number" inputmode="numeric" min="0" placeholder="例：8000">
      </div>
      <div class="notice">
        <div class="notice-title">⚠️ 注意事項</div>
        <div>※期待値を基準とした概算です。週○回運用を継続した場合の累計です。<br>「持続」は4週を1ヶ月として表示しています。<br>計算結果は長期間運用時の平均的な目安としてご利用ください。</div>
      </div>
      <div class="result-title">結果</div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>運用</th><th>1週期待</th><th>累計精錬火晶</th><th>持続週</th></tr></thead>
          <tbody id="ownedRows"></tbody>
        </table>
      </div>
    </section>

    <!-- タブ②：必要精錬火晶 -->
    <section class="panel" id="panel-target">
      <div class="field">
        <label for="targetRefine">目標精錬火晶</label>
        <input id="targetRefine" type="number" inputmode="numeric" min="0" placeholder="例：500">
      </div>
      <div class="field">
        <label for="currentRefine">現在保有精錬火晶</label>
        <input id="currentRefine" type="number" inputmode="numeric" min="0" placeholder="例：120">
      </div>
      <div class="lack-box">
        <span>不足精錬火晶</span>
        <span id="lackValue">0個</span>
      </div>
      <div class="notice">
        <div class="notice-title">⚠️ 注意事項</div>
        <div>※期待値を基準とした概算です。<br>計算結果は長期間運用時の平均的な目安としてご利用ください。</div>
      </div>
      <div class="result-title">結果</div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>運用</th><th>必要期間</th><th>必要火晶</th></tr></thead>
          <tbody id="targetRows"></tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<a class="back-btn" href="/1648-portal/cost/">← コストRoomへ戻る</a>

<script>
// ─── 1回あたりコスト（累積コストから逆算） ───
function costPerRoll(i) {
  if (i <= 20) return 16.5;
  if (i <= 26) return 35;
  if (i <= 40) return 50;
  if (i <= 46) return 75;
  if (i <= 60) return 100;
  if (i <= 66) return 115;
  if (i <= 80) return 130;
  if (i <= 86) return 145;
  return 160;
}

// ─── 1回あたり期待精錬火晶（確率テーブルから計算） ───
// 1〜20回:  {1:65%, 2:25%, 3:10%}                              → 1.45
// 21〜40回: {2:85%, 3:15%}                                     → 2.15
// 41〜60回: {3:85%, 4:12.5%, 5:2%, 6:0.5%}                    → 3.18
// 61〜80回: {3:75%, 4:15%, 5:5%, 6:3%, 7:1%, 8:0.5%, 9:0.5%} → 3.435
// 81〜100回: {3:70%, 4:12%, 5:9%, 6:4%, 7:1.5%, 8:1%, 9:1%, 10:0.5%, 11:0.5%, 12:0.5%} → 3.71
function evPerRoll(i) {
  if (i <= 20) return 1.45;
  if (i <= 40) return 2.15;
  if (i <= 60) return 3.18;
  if (i <= 80) return 3.435;
  return 3.71;
}

// ─── 週○回運用の1週コスト ───
const WEEKLY_PLANS = [20, 26, 40, 46, 60, 66, 80, 86, 100];
const weeklyCost = {};
let cc = 0;
for (let i = 1; i <= 100; i++) {
  cc += costPerRoll(i);
  if (WEEKLY_PLANS.includes(i)) weeklyCost[i] = Math.round(cc * 10) / 10;
}

// ─── 週○回を繰り返した場合の合計回数・期待精錬火晶 ───
// 毎週 1〜weeklyRolls 回目を繰り返す（週ごとに確率帯リセット）
function calcOwnedResult(owned, weeklyRolls) {
  const wCost = weeklyCost[weeklyRolls];

  // 1週あたりの期待精錬火晶
  let evPerWeek = 0;
  for (let i = 1; i <= weeklyRolls; i++) evPerWeek += evPerRoll(i);

  // フルで回せる週数
  const fullWeeks = Math.floor(owned / wCost);
  const remainder = owned - fullWeeks * wCost;

  let totalEv   = fullWeeks * evPerWeek;
  let totalRolls = fullWeeks * weeklyRolls;

  // 端数の週（途中まで）
  let rem = remainder;
  for (let i = 1; i <= weeklyRolls; i++) {
    const c = costPerRoll(i);
    if (rem < c) {
      totalEv += (rem / c) * evPerRoll(i);
      break;
    }
    rem -= c;
    totalEv    += evPerRoll(i);
    totalRolls += 1;
  }

  return { totalRolls, totalEv };
}

// ─── 目標達成に必要な週数・火晶 ───
function calcWeeksNeeded(lack, weeklyRolls) {
  if (!lack) return { weeks: 0, cost: 0 };
  // 1週の期待精錬火晶
  let evPerWeek = 0;
  for (let i = 1; i <= weeklyRolls; i++) evPerWeek += evPerRoll(i);
  const weeks = Math.ceil(lack / evPerWeek);
  const cost  = weeks * weeklyCost[weeklyRolls];
  return { weeks, cost };
}

// ─── UI ───
const fmt = new Intl.NumberFormat("ja-JP");
const ownedRows    = document.getElementById("ownedRows");
const targetRows   = document.getElementById("targetRows");
const ownedInput   = document.getElementById("ownedCrystal");
const targetInput  = document.getElementById("targetRefine");
const currentInput = document.getElementById("currentRefine");
const lackSpan     = document.getElementById("lackValue");

function n(v) { const x = Number(v); return (Number.isFinite(x) && x > 0) ? x : 0; }
function empty() { return '<span class="empty">—</span>'; }

function renderOwned() {
  const owned = n(ownedInput.value);
  ownedRows.innerHTML = WEEKLY_PLANS.map(w => {
    if (!owned) return `<tr><td>週${w}回まで</td><td>${empty()}</td><td>${empty()}</td><td>${empty()}</td></tr>`;

    const wCost = weeklyCost[w];

    // 1週あたり期待精錬火晶
    let evPerWeek = 0;
    for (let i = 1; i <= w; i++) evPerWeek += evPerRoll(i);
    const evPerWeekStr = evPerWeek % 1 === 0
      ? fmt.format(evPerWeek)
      : fmt.format(Math.round(evPerWeek * 10) / 10);

    // 1週分すら賄えない → グレーアウト
    if (owned < wCost) {
      return `<tr class="row-disabled">
        <td>週${w}回まで</td>
        <td>${evPerWeekStr}個</td>
        <td colspan="2" class="insufficient">火晶不足（1週${fmt.format(wCost)}個必要）</td>
      </tr>`;
    }

    const { totalEv } = calcOwnedResult(owned, w);
    const sustainWeeks = Math.floor(owned / wCost);
    const months = Math.floor(sustainWeeks / 4);
    const remWeeks = sustainWeeks % 4;
    const sustainStr = months > 0 && remWeeks > 0 ? `${months}ヶ月${remWeeks}週`
                     : months > 0                  ? `${months}ヶ月`
                     : `${remWeeks}週`;
    return `<tr>
      <td>週${w}回まで</td>
      <td>${evPerWeekStr}個</td>
      <td>${fmt.format(Math.floor(totalEv))}個</td>
      <td>${sustainStr}</td>
    </tr>`;
  }).join("");
}

function renderTarget() {
  const target  = n(targetInput.value);
  const current = n(currentInput.value);
  const lack    = Math.max(0, target - current);
  lackSpan.textContent = fmt.format(Math.floor(lack)) + "個";

  targetRows.innerHTML = WEEKLY_PLANS.map(w => {
    if (!lack) return `<tr><td>週${w}回まで</td><td>${empty()}</td><td>${empty()}</td></tr>`;
    const { weeks, cost } = calcWeeksNeeded(lack, w);
    return `<tr>
      <td>週${w}回まで</td>
      <td>約${fmt.format(weeks)}週（約${fmt.format(weeks * 7)}日）</td>
      <td>${fmt.format(Math.ceil(cost))}個</td>
    </tr>`;
  }).join("");
}

function switchTab(name) {
  document.querySelectorAll(".tab-btn").forEach(btn =>
    btn.classList.toggle("active", btn.dataset.tab === name));
  document.querySelectorAll(".panel").forEach(p =>
    p.classList.toggle("active", p.id === "panel-" + name));
}

document.querySelectorAll(".tab-btn").forEach(btn =>
  btn.addEventListener("click", () => switchTab(btn.dataset.tab)));
ownedInput.addEventListener("input", renderOwned);
targetInput.addEventListener("input", renderTarget);
currentInput.addEventListener("input", renderTarget);
renderOwned();
renderTarget();
</script>
</body>
</html>

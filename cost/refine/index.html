<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>精錬火晶計画</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100%}
body{
  font-family:"Segoe UI",sans-serif;color:#fff;background:#05080d;
  min-height:100vh;overflow-x:hidden;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 72px)
}
body::before{
  content:"";position:fixed;inset:0;z-index:-3;
  background:url("refine-bg.jpg") center center/cover no-repeat;
}
body::after{content:"";position:fixed;inset:0;z-index:-2;background:rgba(0,0,0,.34)}
.page{
  width:100%;max-width:520px;margin:0 auto;
  padding:calc(env(safe-area-inset-top,0px) + 22px) 14px 24px
}
.header{margin-bottom:14px;text-align:left}
.logo{
  font-size:23px;font-weight:1000;letter-spacing:.02em;
  text-shadow:0 0 12px rgba(255,216,132,.6),0 0 24px rgba(255,146,54,.3)
}
.sub{margin-top:4px;font-size:12px;color:rgba(218,238,255,.82);line-height:1.45}
.ui-visual{
  width:100%;overflow:hidden;border-radius:18px;margin:0 0 12px;
  border:1px solid rgba(255,184,77,.30);
  background:rgba(0,0,0,.28);
  box-shadow:0 14px 42px rgba(0,0,0,.36),0 0 26px rgba(255,96,26,.12);
}
.ui-visual img{display:block;width:100%;height:auto}
.card{
  background:rgba(6,16,31,.66);border:1px solid rgba(142,213,255,.24);
  border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.38);
  backdrop-filter:blur(10px);padding:12px
}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.tab-btn{
  border:1px solid rgba(255,255,255,.18);border-radius:13px;padding:10px 8px;
  background:rgba(255,255,255,.08);color:rgba(255,255,255,.78);
  font-size:13px;font-weight:900;-webkit-tap-highlight-color:transparent
}
.tab-btn.active{
  background:linear-gradient(135deg,rgba(255,178,58,.95),rgba(255,112,37,.86));
  color:#170b02;border-color:rgba(255,220,140,.85);
  box-shadow:0 0 18px rgba(255,162,50,.25)
}
.panel{display:none}.panel.active{display:block}
.field{margin:10px 0 12px}
label{display:block;font-size:12px;font-weight:900;color:#d7efff;margin-bottom:6px}
input{
  width:100%;height:44px;border-radius:12px;border:1px solid rgba(156,219,255,.28);
  background:rgba(0,0,0,.38);color:#fff;font-size:18px;font-weight:900;
  padding:0 12px;outline:none
}
input:focus{border-color:#ffc34a;box-shadow:0 0 0 3px rgba(255,195,74,.16)}
.hint{font-size:11px;color:rgba(222,241,255,.72);margin-top:4px;line-height:1.4}
.notice{
  margin:12px 0;padding:10px 11px;border-radius:13px;
  background:rgba(255,193,74,.12);border:1px solid rgba(255,211,122,.32);
  color:rgba(255,244,218,.95);font-size:12px;line-height:1.55
}
.notice-title{font-weight:1000;margin-bottom:3px}
.result-title{font-size:13px;font-weight:1000;margin:12px 0 8px;color:#fff}
.table-wrap{width:100%;overflow-x:auto;border-radius:13px;border:1px solid rgba(255,255,255,.14)}
table{width:100%;border-collapse:collapse;background:rgba(0,0,0,.24);min-width:330px}
th,td{padding:9px 8px;border-bottom:1px solid rgba(255,255,255,.1);font-size:12px;text-align:right;white-space:nowrap}
th{background:rgba(255,255,255,.08);color:#bfeaff;font-size:11px;font-weight:1000}
th:first-child,td:first-child{text-align:left;font-weight:1000;color:#fff}
tr:last-child td{border-bottom:none}
.empty{color:rgba(255,255,255,.45)}
.lack-box{
  margin:8px 0 10px;padding:9px 10px;border-radius:12px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
  display:flex;align-items:center;justify-content:space-between;gap:10px
}
.lack-box span:first-child{font-size:12px;color:rgba(220,240,255,.76);font-weight:900}
.lack-box span:last-child{font-size:18px;color:#ffd787;font-weight:1000}
.back-btn{
  position:fixed;left:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:9999;
  min-height:38px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.28);
  background:rgba(0,0,0,.72);color:#fff;text-decoration:none;font-size:12px;font-weight:900;
  display:inline-flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);
  box-shadow:0 8px 24px rgba(0,0,0,.35);-webkit-tap-highlight-color:transparent
}
.back-btn:active{transform:scale(.96)}
@media(max-width:360px){.logo{font-size:21px}th,td{padding:8px 6px;font-size:11px}.tab-btn{font-size:12px}}
</style>
<script>
(function(){
  const LOGIN_URL="https://discord.com/oauth2/authorize?client_id=1514478819799470080&response_type=code&redirect_uri=https%3A%2F%2Fkekj12kek-sudo.github.io%2F1648-portal%2Fauth%2Fcallback%2F&scope=identify";
  const PROFILE_SETUP_URL="/1648-portal/profile-setup/";
  const COST_URL="/1648-portal/cost/";
  try{
    const raw=localStorage.getItem("discord_user");
    if(!raw){ location.replace(LOGIN_URL); return; }
    const data=JSON.parse(raw);
    if(!data || data.ok!==true){ localStorage.removeItem("discord_user"); location.replace(LOGIN_URL); return; }
    if(data.status==="pending_profile"){ location.replace(PROFILE_SETUP_URL); return; }
    if(data.status!=="active"){ localStorage.removeItem("discord_user"); location.replace(LOGIN_URL); return; }
    if(sessionStorage.getItem("portal_entry")!=="1" || sessionStorage.getItem("refine_plan_entry")!=="1"){
      location.replace(COST_URL);
      return;
    }
  }catch(e){
    localStorage.removeItem("discord_user");
    location.replace(LOGIN_URL);
  }
})();
</script>
</head>
<body>
<div class="page">
  <header class="header">
    <div class="logo">精錬火晶計画</div>
    <div class="sub">手持ち火晶から作れる数、目標までの期間と必要火晶を確認できます。</div>
  </header>

  <div class="ui-visual" aria-label="精錬火晶計画イメージ">
    <img src="./refine-ui.jpg" alt="火晶から精錬火晶へ精製するイメージ">
  </div>

  <main class="card">
    <div class="tabs" role="tablist" aria-label="計算切替">
      <button class="tab-btn active" type="button" data-tab="owned">手持ち火晶</button>
      <button class="tab-btn" type="button" data-tab="target">必要精錬火晶</button>
    </div>

    <section class="panel active" id="panel-owned">
      <div class="field">
        <label for="ownedCrystal">保有火晶</label>
        <input id="ownedCrystal" type="number" inputmode="numeric" min="0" placeholder="例：8000">
      </div>

      <div class="notice">
        <div class="notice-title">⚠️ 注意事項</div>
        <div>※期待値を基準とした概算です。<br>計算結果は長期間運用時の平均的な目安としてご利用ください。</div>
      </div>

      <div class="result-title">結果</div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>運用</th><th>期待精錬火晶</th><th>持続週</th></tr></thead>
          <tbody id="ownedRows"></tbody>
        </table>
      </div>
    </section>

    <section class="panel" id="panel-target">
      <div class="field">
        <label for="targetRefine">目標精錬火晶</label>
        <input id="targetRefine" type="number" inputmode="numeric" min="0" placeholder="例：500">
      </div>
      <div class="field">
        <label for="currentRefine">現在保有精錬火晶</label>
        <input id="currentRefine" type="number" inputmode="numeric" min="0" placeholder="例：120">
      </div>

      <div class="lack-box"><span>不足精錬火晶</span><span id="lackValue">0個</span></div>

      <div class="notice">
        <div class="notice-title">⚠️ 注意事項</div>
        <div>※期待値を基準とした概算です。<br>計算結果は長期間運用時の平均的な目安としてご利用ください。</div>
      </div>

      <div class="result-title">結果</div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>運用</th><th>必要期間</th><th>必要火晶</th></tr></thead>
          <tbody id="targetRows"></tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<a class="back-btn" href="/1648-portal/cost/">コストRoomへ戻る</a>

<script>
const refineMaster=[
 {week:20,cost:330,expected:29.0},
 {week:26,cost:540,expected:41.9},
 {week:40,cost:1240,expected:72.0},
 {week:46,cost:1690,expected:91.1},
 {week:60,cost:3090,expected:135.6},
 {week:66,cost:3780,expected:156.2},
 {week:80,cost:5600,expected:204.3},
 {week:86,cost:6470,expected:226.6},
 {week:100,cost:8710,expected:278.5}
];

const yen=new Intl.NumberFormat("ja-JP");
const ownedRows=document.getElementById("ownedRows");
const targetRows=document.getElementById("targetRows");
const ownedCrystal=document.getElementById("ownedCrystal");
const targetRefine=document.getElementById("targetRefine");
const currentRefine=document.getElementById("currentRefine");
const lackValue=document.getElementById("lackValue");

function n(v){const x=Number(v);return Number.isFinite(x)&&x>0?x:0}
function floorInt(v){return Math.max(0,Math.floor(v))}
function floor1(v){return Math.max(0,Math.floor(v*10)/10)}
function fmtInt(v){return yen.format(Math.max(0,Math.floor(v)))}
function fmtWeek(v){return yen.format(floor1(v).toFixed(1))}
function empty(){return '<span class="empty">—</span>'}

function renderOwned(){
  const owned=n(ownedCrystal.value);
  ownedRows.innerHTML=refineMaster.map(m=>{
    if(!owned){return `<tr><td>週${m.week}回</td><td>${empty()}</td><td>${empty()}</td></tr>`}
    const weeks=owned/m.cost;
    const expected=weeks*m.expected;
    return `<tr><td>週${m.week}回</td><td>${fmtInt(expected)}個</td><td>${fmtWeek(weeks)}週</td></tr>`;
  }).join("");
}

function renderTarget(){
  const target=n(targetRefine.value);
  const current=n(currentRefine.value);
  const lack=Math.max(0,target-current);
  lackValue.textContent=fmtInt(lack)+"個";
  targetRows.innerHTML=refineMaster.map(m=>{
    if(!lack){return `<tr><td>週${m.week}回</td><td>${empty()}</td><td>${empty()}</td></tr>`}
    const weeks=Math.ceil(lack/m.expected);
    const days=weeks*7;
    const cost=weeks*m.cost;
    return `<tr><td>週${m.week}回</td><td>約${yen.format(weeks)}週（約${yen.format(days)}日）</td><td>${fmtInt(cost)}個</td></tr>`;
  }).join("");
}

function switchTab(name){
  document.querySelectorAll(".tab-btn").forEach(btn=>btn.classList.toggle("active",btn.dataset.tab===name));
  document.querySelectorAll(".panel").forEach(panel=>panel.classList.toggle("active",panel.id==="panel-"+name));
}

document.querySelectorAll(".tab-btn").forEach(btn=>btn.addEventListener("click",()=>switchTab(btn.dataset.tab)));
ownedCrystal.addEventListener("input",renderOwned);
targetRefine.addEventListener("input",renderTarget);
currentRefine.addEventListener("input",renderTarget);
renderOwned();
renderTarget();
</script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>アンケート集計</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100%;background:radial-gradient(circle at 16% 0%,rgba(96,165,250,.13),transparent 28%),radial-gradient(circle at 90% 8%,rgba(34,197,94,.10),transparent 26%),#070b12;color:#fff;font-family:'Hiragino Sans','Yu Gothic',system-ui,sans-serif}
body{padding:14px;padding-bottom:34px}
.header{position:sticky;top:0;z-index:20;margin:-14px -14px 14px;padding:14px;background:linear-gradient(180deg,rgba(7,11,18,.98),rgba(7,11,18,.86));border-bottom:1px solid rgba(255,255,255,.08);backdrop-filter:blur(10px)}
h1{font-size:21px;color:#60a5fa;line-height:1.3}.sub{margin-top:5px;font-size:12px;opacity:.78;line-height:1.65}.back{display:inline-flex;align-items:center;min-height:34px;margin-top:10px;color:#bfdbfe;text-decoration:none;font-size:12px;font-weight:900}
.panel{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.055);border-radius:20px;padding:14px;margin-bottom:14px;box-shadow:0 14px 30px rgba(0,0,0,.20)}
.panel-title{font-size:16px;font-weight:950;color:#bfdbfe;line-height:1.45}.help{margin-top:8px;font-size:12px;line-height:1.7;color:#cbd5e1;opacity:.86}
.survey-list{display:flex;flex-direction:column;gap:10px;margin-top:12px}.survey-card{border:1px solid rgba(255,255,255,.12);background:linear-gradient(135deg,rgba(30,41,59,.96),rgba(15,23,42,.96));border-radius:18px;padding:13px;cursor:pointer}.survey-card.active{border-color:rgba(96,165,250,.55);box-shadow:0 0 0 1px rgba(96,165,250,.20),0 0 22px rgba(37,99,235,.16)}
.survey-title{font-size:15px;font-weight:950;line-height:1.45}.survey-meta{margin-top:7px;font-size:11px;line-height:1.65;color:#cbd5e1;opacity:.78}
.badge-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:950;background:rgba(255,255,255,.10);color:#e5e7eb}.badge.open{background:rgba(34,197,94,.16);color:#bbf7d0}.badge.closed{background:rgba(248,113,113,.14);color:#fecaca}.badge.draft{background:rgba(250,204,21,.14);color:#fde68a}
.tabs{position:sticky;top:86px;z-index:15;display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:14px;padding:8px;border:1px solid rgba(255,255,255,.10);border-radius:18px;background:rgba(7,11,18,.92);backdrop-filter:blur(10px)}
.tab{min-height:42px;border:none;border-radius:13px;background:rgba(255,255,255,.07);color:#cbd5e1;font-size:12px;font-weight:950;cursor:pointer}.tab.active{background:linear-gradient(135deg,#2563eb,#60a5fa);color:#fff}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.summary-box{border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.045);border-radius:15px;padding:10px}.summary-label{font-size:10px;font-weight:900;color:#94a3b8}.summary-value{margin-top:3px;font-size:18px;font-weight:950;color:#fff}
.alliance-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}.alliance-row{border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.045);border-radius:15px;padding:10px}.alliance-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.alliance-name{font-size:13px;font-weight:950}.alliance-count{font-size:14px;font-weight:950;color:#86efac}
.bar{height:8px;border-radius:999px;background:rgba(255,255,255,.10);overflow:hidden;margin-top:9px}.bar-fill{height:100%;width:0%;background:linear-gradient(90deg,#2563eb,#86efac);border-radius:999px}
.member-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}.member-row{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.045);border-radius:15px;padding:11px}.member-name{font-size:14px;font-weight:950;line-height:1.45}.member-meta{font-size:11px;line-height:1.5;color:#cbd5e1;opacity:.78;text-align:right}
.question-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.qtag{border:none;border-radius:999px;padding:9px 11px;background:rgba(255,255,255,.08);color:#dbeafe;font-size:12px;font-weight:950;cursor:pointer;border:1px solid rgba(255,255,255,.10)}.qtag.active{background:linear-gradient(135deg,#2563eb,#60a5fa);color:#fff;border-color:rgba(96,165,250,.45)}
.detail-title{font-size:16px;font-weight:950;color:#86efac;line-height:1.45}.copy-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:12px}.copy-btn{min-height:42px;border:none;border-radius:13px;background:rgba(96,165,250,.16);color:#bfdbfe;font-size:11px;font-weight:950;cursor:pointer}.copy-btn.all{background:linear-gradient(135deg,#16a34a,#86efac);color:#052e16}
.result-list{display:flex;flex-direction:column;gap:10px;margin-top:12px}.result-card{border:1px solid rgba(255,255,255,.12);background:linear-gradient(135deg,rgba(34,197,94,.09),rgba(15,23,42,.88));border-radius:17px;padding:10px}.result-head{display:flex;gap:10px;align-items:center}.result-img{width:64px;height:64px;border-radius:13px;object-fit:cover;background:rgba(255,255,255,.08);flex-shrink:0}.result-name{font-size:15px;font-weight:950;line-height:1.4}.result-count{margin-left:auto;font-size:18px;font-weight:950;color:#86efac;white-space:nowrap}.result-members{margin-top:8px;border-top:1px solid rgba(255,255,255,.10);padding-top:8px;font-size:12px;line-height:1.75;color:#e5e7eb}
.empty{font-size:13px;line-height:1.75;opacity:.74;text-align:center;padding:26px 8px}.error{color:#fca5a5}.loading{opacity:.76}.toast{position:fixed;left:14px;right:14px;bottom:18px;z-index:50;border:1px solid rgba(134,239,172,.25);background:rgba(15,23,42,.96);color:#bbf7d0;border-radius:15px;padding:12px;text-align:center;font-size:13px;font-weight:950;display:none}
@media(min-width:520px){body{max-width:520px;margin:0 auto}.toast{left:calc(50% - 246px);right:calc(50% - 246px)}}
</style>
</head>
<body>
<div id="app"></div><div id="toast" class="toast"></div>
<script>
const LOGIN_URL="https://discord.com/oauth2/authorize?client_id=1514478819799470080&response_type=code&redirect_uri=https%3A%2F%2Fkekj12kek-sudo.github.io%2F1648-portal%2Fauth%2Fcallback%2F&scope=identify";
const ADMIN_URL="/1648-portal/admin/";
const RESULTS_URL="https://us-central1-yoyaku-4ec7c.cloudfunctions.net/getSurveyResults";
let session=null,surveys=[],selectedSurveyId="",selectedSummary=null,selectedDetail=null,activeTab="summary",activeQuestionId="";
function getSession(){const raw=localStorage.getItem("discord_user");if(!raw){window.location.replace(LOGIN_URL);return null}try{const data=JSON.parse(raw);if(!data.ok){localStorage.removeItem("discord_user");window.location.replace(LOGIN_URL);return null}if(data.status==="pending_profile"){window.location.replace("/1648-portal/profile-setup/");return null}if(data.status!=="active"){localStorage.removeItem("discord_user");window.location.replace(LOGIN_URL);return null}return data}catch(e){localStorage.removeItem("discord_user");window.location.replace(LOGIN_URL);return null}}
function getDiscordId(){return session?.user?.discordId||session?.discord?.id||session?.discordId||""}
function getPermissionLevel(data){const discordId=data?.user?.discordId||data?.discord?.id||data?.discordId||"";if(discordId==="795152243883114527")return 3;const role=data?.role||data?.user?.role||"member";return {developer:3,manager:2,technical:1,member:0}[role]??0}
function renderShell(content){document.getElementById("app").innerHTML=`<div class="header"><h1>アンケート集計</h1><div class="sub">概要・回答者・質問別詳細を確認します。</div><a class="back" href="${ADMIN_URL}">← 管理ページへ戻る</a></div>${content}`}
async function fetchResults(surveyId=""){const res=await fetch(RESULTS_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({discordId:getDiscordId(),surveyId})});const data=await res.json();if(!res.ok||!data.ok)throw new Error(data.error||"load_failed");return data}
async function loadList(){renderShell(`<div class="panel"><div class="empty loading">読み込み中...</div></div>`);try{const data=await fetchResults("");surveys=(data.surveys||[]).filter(s=>s.title&&s.title!=="無題"&&s.id!=="sample");if(!surveys.length){renderShell(`<div class="panel"><div class="panel-title">集計対象なし</div><div class="empty">表示できるアンケートがありません。</div></div>`);return}selectedSurveyId=selectedSurveyId||surveys[0].id;await loadDetail(selectedSurveyId)}catch(err){renderShell(`<div class="panel"><div class="panel-title error">読み込み失敗</div><div class="empty error">${escapeHtml(err.message)}</div></div>`)}}
async function loadDetail(id){selectedSurveyId=id;const data=await fetchResults(id);selectedDetail=data;selectedSummary=surveys.find(s=>s.id===id)||data.survey;activeQuestionId=activeQuestionId||firstQuestionId();render()}
function render(){renderShell(`<div class="panel"><div class="panel-title">アンケート一覧</div><div class="help">確認するアンケートを選んでください。</div><div class="survey-list">${surveys.map(surveyCard).join("")}</div></div>${tabs()}${tabContent()}`);document.querySelectorAll("[data-survey-id]").forEach(card=>{card.addEventListener("click",async()=>{activeTab="summary";activeQuestionId="";await loadDetail(card.dataset.surveyId);setTimeout(()=>document.getElementById("tabs")?.scrollIntoView({behavior:"smooth",block:"start"}),50)})});document.querySelectorAll("[data-tab]").forEach(btn=>{btn.addEventListener("click",()=>{activeTab=btn.dataset.tab;if(activeTab==="detail"&&!activeQuestionId)activeQuestionId=firstQuestionId();render();setTimeout(()=>document.getElementById("tabs")?.scrollIntoView({behavior:"smooth",block:"start"}),50)})});document.querySelectorAll("[data-question]").forEach(btn=>{btn.addEventListener("click",()=>{activeQuestionId=btn.dataset.question;render()})});document.querySelectorAll("[data-copy]").forEach(btn=>{btn.addEventListener("click",()=>copyText(btn.dataset.copy))})}
function surveyCard(s){const active=s.id===selectedSurveyId;return `<div class="survey-card ${active?"active":""}" data-survey-id="${escapeAttr(s.id)}"><div class="survey-title">${escapeHtml(s.title)}</div>${s.note?`<div class="survey-meta">${escapeHtml(s.note)}</div>`:""}<div class="badge-row"><span class="badge ${escapeAttr(s.status||"")}">${statusLabel(s.status)}</span><span class="badge">回答 ${Number(s.answerCount||0)}人</span></div></div>`}
function tabs(){return `<div class="tabs" id="tabs"><button class="tab ${activeTab==="summary"?"active":""}" data-tab="summary">概要</button><button class="tab ${activeTab==="members"?"active":""}" data-tab="members">回答者</button><button class="tab ${activeTab==="detail"?"active":""}" data-tab="detail">詳細</button></div>`}
function tabContent(){if(activeTab==="members")return membersPanel();if(activeTab==="detail")return detailPanel();return summaryPanel()}
function answers(){return selectedDetail?.answers||[]}function questions(){return selectedDetail?.questions||[]}
function summaryPanel(){const portal=selectedDetail?.portalSummary||{answered:answers().length,total:0};const alliances=selectedDetail?.allianceSummary||buildAllianceSummaryFallback();return `<div class="panel"><div class="panel-title">${escapeHtml(selectedDetail?.survey?.title||selectedSummary?.title||"")}</div>${selectedDetail?.survey?.note?`<div class="help">${escapeHtml(selectedDetail.survey.note)}</div>`:""}<div class="summary-grid"><div class="summary-box"><div class="summary-label">全体回答</div><div class="summary-value">${Number(portal.answered||0)} / ${Number(portal.total||0)}</div></div><div class="summary-box"><div class="summary-label">回答率</div><div class="summary-value">${percent(portal.answered,portal.total)}%</div></div></div></div><div class="panel"><div class="panel-title">同盟別回答</div>${alliances.length?`<div class="alliance-list">${alliances.map(allianceRow).join("")}</div>`:`<div class="empty">同盟データはありません。</div>`}</div>`}
function allianceRow(a){const p=percent(a.answered,a.total);return `<div class="alliance-row"><div class="alliance-top"><div class="alliance-name">${escapeHtml(a.alliance||a.name||"未設定")}</div><div class="alliance-count">${Number(a.answered||0)} / ${Number(a.total||0)}</div></div><div class="bar"><div class="bar-fill" style="width:${p}%"></div></div></div>`}
function membersPanel(){const arr=answers();return `<div class="panel"><div class="panel-title">回答者</div><div class="help">回答した人の名前と同盟です。</div>${arr.length?`<div class="member-list">${arr.map(a=>`<div class="member-row"><div><div class="member-name">${escapeHtml(a.playerName||"名前未登録")}</div><div class="member-meta" style="text-align:left">${escapeHtml(a.alliance||"-")}</div></div><div class="member-meta">${escapeHtml(formatTimestamp(a.updatedAt||a.submittedAt))}</div></div>`).join("")}</div>`:`<div class="empty">回答者はいません。</div>`}</div>`}
function detailPanel(){const qs=questions();if(!qs.length)return `<div class="panel"><div class="panel-title">詳細</div><div class="empty">質問データがありません。</div></div>`;if(!activeQuestionId)activeQuestionId=qs[0].id;const active=qs.find(q=>q.id===activeQuestionId)||qs[0];const detail=buildQuestionDetail(active);return `<div class="panel"><div class="panel-title">詳細</div><div class="help">質問を選ぶと、集計とリストを確認できます。</div><div class="question-tags">${qs.map(q=>`<button class="qtag ${q.id===active.id?"active":""}" data-question="${escapeAttr(q.id)}">${escapeHtml(q.title||q.id)}</button>`).join("")}</div></div><div class="panel"><div class="detail-title">${escapeHtml(active.title||active.id)}</div><div class="copy-row"><button class="copy-btn" data-copy="${escapeAttr(detail.summaryText)}">集計コピー</button><button class="copy-btn" data-copy="${escapeAttr(detail.listText)}">リストコピー</button><button class="copy-btn all" data-copy="${escapeAttr(detail.allText)}">全部コピー</button></div>${detail.items.length?`<div class="result-list">${detail.items.map(resultCard).join("")}</div>`:`<div class="empty">回答データがありません。</div>`}</div>`}
function buildQuestionDetail(q){const map=new Map();answers().forEach(a=>{const raw=a.answers?a.answers[q.id]:undefined;normalizeValues(raw).forEach(v=>{const key=String(v||"").trim();if(!key)return;if(!map.has(key))map.set(key,{key,label:labelForValue(q,key),imageUrl:imageForValue(q,key),members:[]});map.get(key).members.push({playerName:a.playerName||"名前未登録",alliance:a.alliance||"-"})})});const items=Array.from(map.values()).map(item=>({...item,count:item.members.length})).sort((a,b)=>b.count-a.count||a.label.localeCompare(b.label,"ja"));const title=q.title||q.id;const summaryText=`【${title}】\n\n■集計\n\n`+(items.length?items.map(i=>`${i.label} ${i.count}人`).join("\n"):"回答なし");const listText=`【${title}】\n\n■リスト\n\n`+(items.length?items.map(i=>`【${i.label}】\n${i.members.map(m=>`${m.playerName} / ${m.alliance}`).join("\n")}`).join("\n\n"):"回答なし");const allText=`${summaryText}\n\n${listText.replace(`【${title}】\n\n`,"")}`;return {items,summaryText,listText,allText}}
function resultCard(i){const names=i.members.map(m=>`${escapeHtml(m.playerName)} / ${escapeHtml(m.alliance)}`).join("<br>");return `<div class="result-card"><div class="result-head">${i.imageUrl?`<img class="result-img" src="${escapeAttr(i.imageUrl)}" alt="">`:""}<div style="min-width:0;flex:1"><div class="result-name">${escapeHtml(i.label)}</div></div><div class="result-count">${i.count}</div></div><div class="result-members">${names}</div></div>`}
function normalizeValues(v){if(Array.isArray(v))return v;if(v===null||v===undefined)return [];if(typeof v==="object")return [JSON.stringify(v)];const text=String(v).trim();return text?[text]:[]}
function labelForValue(q,key){if(q.id==="heroes"){const opt=(q.options||[]).find(o=>o.id===key||o.name===key);return opt?.name||key}return key}
function imageForValue(q,key){if(q.id==="heroes"){const opt=(q.options||[]).find(o=>o.id===key||o.name===key);return opt?.imageUrl||""}return ""}
function firstQuestionId(){return questions()[0]?.id||""}
function buildAllianceSummaryFallback(){const map=new Map();answers().forEach(a=>{const name=a.alliance||"未設定";if(!map.has(name))map.set(name,{alliance:name,answered:0,total:0});map.get(name).answered+=1});return Array.from(map.values())}
function percent(a,b){a=Number(a||0);b=Number(b||0);return b?Math.round(a/b*100):0}
async function copyText(text){try{await navigator.clipboard.writeText((text||"").replaceAll("\\n","\n"));showToast("コピーしました")}catch(e){showToast("コピーできませんでした")}}
function showToast(msg){const el=document.getElementById("toast");el.textContent=msg;el.style.display="block";setTimeout(()=>el.style.display="none",1600)}
function statusLabel(status){return {draft:"下書き",open:"公開中",closed:"締切"}[status]||status||"-"}
function formatTimestamp(value){if(!value)return "";if(typeof value==="string")return value;if(value._seconds)return new Date(value._seconds*1000).toLocaleString("ja-JP");if(value.seconds)return new Date(value.seconds*1000).toLocaleString("ja-JP");return ""}
function escapeHtml(str){return String(str).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function escapeAttr(str){return escapeHtml(str)}
session=getSession();if(session){const level=getPermissionLevel(session);if(level<1){renderShell(`<div class="panel"><div class="panel-title">権限がありません</div><div class="empty">集計画面はテクニカルマネージャー以上が利用できます。</div></div>`)}else{loadList()}}
</script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>アンケート集計</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100%;background:radial-gradient(circle at 18% 0%,rgba(96,165,250,.12),transparent 28%),radial-gradient(circle at 90% 8%,rgba(34,197,94,.10),transparent 26%),#070b12;color:#fff;font-family:'Hiragino Sans','Yu Gothic',system-ui,sans-serif}
body{padding:14px;padding-bottom:34px}
.header{position:sticky;top:0;z-index:20;margin:-14px -14px 14px;padding:14px;background:linear-gradient(180deg,rgba(7,11,18,.98),rgba(7,11,18,.86));border-bottom:1px solid rgba(255,255,255,.08);backdrop-filter:blur(10px)}
h1{font-size:21px;color:#60a5fa;line-height:1.3}.sub{margin-top:5px;font-size:12px;opacity:.78;line-height:1.65}.back{display:inline-flex;align-items:center;min-height:34px;margin-top:10px;color:#bfdbfe;text-decoration:none;font-size:12px;font-weight:900}
.panel{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.055);border-radius:20px;padding:14px;margin-bottom:14px;box-shadow:0 14px 30px rgba(0,0,0,.20)}
.panel-title{font-size:16px;font-weight:950;color:#bfdbfe;line-height:1.45}.help{margin-top:8px;font-size:12px;line-height:1.7;color:#cbd5e1;opacity:.86}.survey-list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.survey-card{border:1px solid rgba(255,255,255,.12);background:linear-gradient(135deg,rgba(30,41,59,.96),rgba(15,23,42,.96));border-radius:18px;padding:13px;cursor:pointer}.survey-card.active{border-color:rgba(96,165,250,.55);box-shadow:0 0 0 1px rgba(96,165,250,.20),0 0 22px rgba(37,99,235,.16)}
.survey-title{font-size:15px;font-weight:950;line-height:1.45}.survey-meta{margin-top:7px;font-size:11px;line-height:1.65;color:#cbd5e1;opacity:.78}.badge-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:950;background:rgba(255,255,255,.10);color:#e5e7eb}.badge.open{background:rgba(34,197,94,.16);color:#bbf7d0}.badge.closed{background:rgba(248,113,113,.14);color:#fecaca}.badge.draft{background:rgba(250,204,21,.14);color:#fde68a}
.tabs{position:sticky;top:86px;z-index:15;display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:14px;padding:8px;border:1px solid rgba(255,255,255,.10);border-radius:18px;background:rgba(7,11,18,.92);backdrop-filter:blur(10px)}.tab{min-height:42px;border:none;border-radius:13px;background:rgba(255,255,255,.07);color:#cbd5e1;font-size:12px;font-weight:950;cursor:pointer}.tab.active{background:linear-gradient(135deg,#2563eb,#60a5fa);color:#fff}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.summary-box{border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.045);border-radius:15px;padding:10px}.summary-label{font-size:10px;font-weight:900;color:#94a3b8}.summary-value{margin-top:3px;font-size:18px;font-weight:950;color:#fff}.alliance-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}.alliance-row{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.045);border-radius:14px;padding:10px}.alliance-name{font-size:13px;font-weight:950}.alliance-count{font-size:14px;font-weight:950;color:#86efac}
.hero-ranking{display:flex;flex-direction:column;gap:10px;margin-top:12px}.hero-row{border:1px solid rgba(255,255,255,.12);background:linear-gradient(135deg,rgba(34,197,94,.10),rgba(15,23,42,.88));border-radius:17px;padding:10px}.hero-head{display:flex;gap:10px;align-items:center}.hero-img{width:72px;height:72px;border-radius:13px;object-fit:cover;background:rgba(255,255,255,.08);flex-shrink:0}.hero-name{font-size:15px;font-weight:950;line-height:1.4}.hero-members{margin-top:4px;font-size:11px;line-height:1.55;color:#cbd5e1}.hero-count{font-size:18px;color:#86efac;font-weight:950;margin-left:auto;padding-left:8px}.bar{height:8px;border-radius:999px;background:rgba(255,255,255,.10);overflow:hidden;margin-top:9px}.bar-fill{height:100%;width:0%;background:linear-gradient(90deg,#16a34a,#86efac);border-radius:999px}
.member-list{display:flex;flex-direction:column;gap:10px;margin-top:12px}.member-card{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.045);border-radius:18px;overflow:hidden}.member-toggle{width:100%;border:none;background:transparent;color:#fff;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;cursor:pointer}.member-name{font-size:15px;font-weight:950;line-height:1.45}.member-meta{margin-top:4px;font-size:11px;line-height:1.6;color:#cbd5e1;opacity:.78}.member-arrow{font-size:16px;color:#93c5fd;font-weight:950}.member-body{display:none;border-top:1px solid rgba(255,255,255,.10);padding:0 12px 12px}.member-card.open .member-body{display:block}.member-card.open .member-arrow{transform:rotate(180deg)}.answer-block{margin-top:10px;border-top:1px solid rgba(255,255,255,.10);padding-top:10px}.answer-block:first-child{border-top:none}.answer-title{font-size:11px;font-weight:950;color:#93c5fd}.answer-text{margin-top:5px;font-size:13px;line-height:1.7;color:#e5e7eb}.empty{font-size:13px;line-height:1.75;opacity:.74;text-align:center;padding:26px 8px}.error{color:#fca5a5}.loading{opacity:.76}
</style>
</head>
<body>
<div id="app"></div>
<script>
const LOGIN_URL="https://discord.com/oauth2/authorize?client_id=1514478819799470080&response_type=code&redirect_uri=https%3A%2F%2Fkekj12kek-sudo.github.io%2F1648-portal%2Fauth%2Fcallback%2F&scope=identify";
const ADMIN_URL="/1648-portal/admin/";
const RESULTS_URL="https://us-central1-yoyaku-4ec7c.cloudfunctions.net/getSurveyResults";
const HERO_URL="https://us-central1-yoyaku-4ec7c.cloudfunctions.net/listHeroCards";
let session=null,surveys=[],selectedSurveyId="",selectedResult=null,activeTab="summary",heroMap={};
function getSession(){const raw=localStorage.getItem("discord_user");if(!raw){window.location.replace(LOGIN_URL);return null}try{const data=JSON.parse(raw);if(!data.ok){localStorage.removeItem("discord_user");window.location.replace(LOGIN_URL);return null}if(data.status==="pending_profile"){window.location.replace("/1648-portal/profile-setup/");return null}if(data.status!=="active"){localStorage.removeItem("discord_user");window.location.replace(LOGIN_URL);return null}return data}catch(e){localStorage.removeItem("discord_user");window.location.replace(LOGIN_URL);return null}}
function getDiscordId(){return session?.user?.discordId||session?.discord?.id||session?.discordId||""}
function getPermissionLevel(data){const discordId=data?.user?.discordId||data?.discord?.id||data?.discordId||"";if(discordId==="795152243883114527")return 3;const role=data?.role||data?.user?.role||"member";return {developer:3,manager:2,technical:1,member:0}[role]??0}
function renderShell(content){document.getElementById("app").innerHTML=`<div class="header"><h1>アンケート集計</h1><div class="sub">回答結果と英雄カード集計を確認します。</div><a class="back" href="${ADMIN_URL}">← 管理ページへ戻る</a></div>${content}`}
async function loadResults(){renderShell(`<div class="panel"><div class="empty loading">読み込み中...</div></div>`);try{await loadHeroes();const res=await fetch(RESULTS_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({discordId:getDiscordId()})});const data=await res.json();if(!res.ok||!data.ok)throw new Error(data.error||"load_failed");surveys=(data.surveys||[]).filter(s=>s.title&&s.title!=="無題"&&s.id!=="sample");if(!surveys.length){renderShell(`<div class="panel"><div class="panel-title">集計対象なし</div><div class="empty">表示できるアンケートがありません。</div></div>`);return}selectedSurveyId=selectedSurveyId||surveys[0].id;selectedResult=surveys.find(s=>s.id===selectedSurveyId)||surveys[0];selectedSurveyId=selectedResult.id;render()}catch(err){renderShell(`<div class="panel"><div class="panel-title error">読み込み失敗</div><div class="empty error">${escapeHtml(err.message)}</div></div>`)}}
async function loadHeroes(){try{const res=await fetch(HERO_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({discordId:getDiscordId()})});const data=await res.json();if(data.ok){(data.heroes||[]).forEach(h=>{heroMap[h.id]={id:h.id,name:h.name||h.id,imageUrl:h.imageUrl||""};if(h.name)heroMap[h.name]={id:h.id,name:h.name,imageUrl:h.imageUrl||""}})}}catch(e){}}
function render(){renderShell(`<div class="panel"><div class="panel-title">アンケート一覧</div><div class="help">確認するアンケートを選んでください。</div><div class="survey-list">${surveys.map(surveyCard).join("")}</div></div>${selectedResult?tabs()+tabContent(selectedResult):""}`);document.querySelectorAll("[data-survey-id]").forEach(card=>{card.addEventListener("click",()=>{selectedSurveyId=card.dataset.surveyId;selectedResult=surveys.find(s=>s.id===selectedSurveyId);activeTab="summary";render();setTimeout(()=>document.getElementById("tabs")?.scrollIntoView({behavior:"smooth",block:"start"}),50)})});document.querySelectorAll("[data-tab]").forEach(btn=>{btn.addEventListener("click",()=>{activeTab=btn.dataset.tab;render();setTimeout(()=>document.getElementById("tabs")?.scrollIntoView({behavior:"smooth",block:"start"}),50)})});document.querySelectorAll("[data-member-toggle]").forEach(btn=>{btn.addEventListener("click",()=>btn.closest(".member-card")?.classList.toggle("open"))})}
function surveyCard(s){const active=s.id===selectedSurveyId;return `<div class="survey-card ${active?"active":""}" data-survey-id="${escapeAttr(s.id)}"><div class="survey-title">${escapeHtml(s.title)}</div>${s.note?`<div class="survey-meta">${escapeHtml(s.note)}</div>`:""}<div class="badge-row"><span class="badge ${escapeAttr(s.status||"")}">${statusLabel(s.status)}</span><span class="badge">回答 ${Number(s.answerCount||getAnswers(s).length||0)}人</span></div></div>`}
function tabs(){return `<div class="tabs" id="tabs"><button class="tab ${activeTab==="summary"?"active":""}" data-tab="summary">概要</button><button class="tab ${activeTab==="heroes"?"active":""}" data-tab="heroes">英雄集計</button><button class="tab ${activeTab==="members"?"active":""}" data-tab="members">回答者</button></div>`}
function tabContent(s){if(activeTab==="heroes")return heroesPanel(s);if(activeTab==="members")return membersPanel(s);return summaryPanel(s)}
function summaryPanel(s){const answers=getAnswers(s),heroes=buildHeroRanking(s),alliances=buildAllianceSummary(answers);return `<div class="panel"><div class="panel-title">${escapeHtml(s.title)}</div>${s.note?`<div class="help">${escapeHtml(s.note)}</div>`:""}<div class="summary-grid"><div class="summary-box"><div class="summary-label">回答数</div><div class="summary-value">${answers.length||Number(s.answerCount||0)}</div></div><div class="summary-box"><div class="summary-label">英雄種類</div><div class="summary-value">${heroes.length}</div></div></div></div><div class="panel"><div class="panel-title">同盟別回答</div>${alliances.length?`<div class="alliance-list">${alliances.map(a=>`<div class="alliance-row"><div class="alliance-name">${escapeHtml(a.name)}</div><div class="alliance-count">${a.count}人</div></div>`).join("")}</div>`:`<div class="empty">同盟データはありません。</div>`}</div>`}
function heroesPanel(s){const heroes=buildHeroRanking(s),max=Math.max(...heroes.map(h=>h.count),1);return `<div class="panel"><div class="panel-title">英雄カード集計</div><div class="help">所持者数が多い順に表示しています。</div>${heroes.length?`<div class="hero-ranking">${heroes.map(h=>heroRow(h,max)).join("")}</div>`:`<div class="empty">英雄カード回答はありません。</div>`}</div>`}
function membersPanel(s){const answers=getAnswers(s);return `<div class="panel"><div class="panel-title">回答者別一覧</div><div class="help">名前をタップすると回答内容を展開します。</div>${answers.length?`<div class="member-list">${answers.map(memberCard).join("")}</div>`:`<div class="empty">回答者はいません。</div>`}</div>`}
function getAnswers(s){return Array.isArray(s.answers)?s.answers:[]}
function normalizeHeroId(v){return String(v||"").trim()}
function heroInfo(id){const key=normalizeHeroId(id);return heroMap[key]||{id:key,name:key,imageUrl:""}}
function buildHeroRanking(s){const direct=Array.isArray(s.heroRanking)?s.heroRanking:[];if(direct.length){return direct.map(h=>{const info=heroInfo(h.id||h.name);return {id:h.id||info.id||h.name,name:h.name||info.name||h.id,imageUrl:h.imageUrl||info.imageUrl||"",count:Number(h.count||0),members:Array.isArray(h.members)?h.members:[]}}).sort((a,b)=>b.count-a.count||(a.name||"").localeCompare(b.name||"","ja"))}const map=new Map();getAnswers(s).forEach(a=>{const arr=Array.isArray(a?.answers?.heroes)?a.answers.heroes:[];arr.forEach(raw=>{const id=normalizeHeroId(raw);if(!id)return;const info=heroInfo(id);if(!map.has(id))map.set(id,{id,name:info.name||id,imageUrl:info.imageUrl||"",count:0,members:[]});const item=map.get(id);item.count+=1;item.members.push(a.playerName||"名前未登録")})});return Array.from(map.values()).sort((a,b)=>b.count-a.count||(a.name||"").localeCompare(b.name||"","ja"))}
function buildAllianceSummary(answers){const map=new Map();answers.forEach(a=>{const name=a.alliance||"未設定";map.set(name,(map.get(name)||0)+1)});return Array.from(map.entries()).map(([name,count])=>({name,count})).sort((a,b)=>b.count-a.count||a.name.localeCompare(b.name,"ja"))}
function heroRow(h,max){const percent=Math.round(Number(h.count||0)/max*100);return `<div class="hero-row"><div class="hero-head">${h.imageUrl?`<img class="hero-img" src="${escapeAttr(h.imageUrl)}" alt="">`:`<div class="hero-img"></div>`}<div style="min-width:0;flex:1"><div class="hero-name">${escapeHtml(h.name||h.id||"不明")}</div>${h.members?.length?`<div class="hero-members">${escapeHtml(h.members.join(" / "))}</div>`:""}</div><div class="hero-count">${Number(h.count||0)}</div></div><div class="bar"><div class="bar-fill" style="width:${percent}%"></div></div></div>`}
function memberCard(a){const answers=a.answers||{},heroes=Array.isArray(answers.heroes)?answers.heroes:[],heroNames=heroes.map(h=>heroInfo(h).name||h),otherAnswers=Object.keys(answers).filter(k=>k!=="heroes");return `<div class="member-card"><button class="member-toggle" data-member-toggle type="button"><div><div class="member-name">${escapeHtml(a.playerName||"名前未登録")}</div><div class="member-meta">${escapeHtml(a.alliance||"-")} / ${escapeHtml(a.gameId||"-")}<br>${escapeHtml(formatTimestamp(a.updatedAt||a.submittedAt))}</div></div><div class="member-arrow">⌄</div></button><div class="member-body">${heroes.length?`<div class="answer-block"><div class="answer-title">英雄育成状況</div><div class="answer-text">${escapeHtml(heroNames.join(" / "))}</div></div>`:""}${otherAnswers.map(k=>`<div class="answer-block"><div class="answer-title">${escapeHtml(k)}</div><div class="answer-text">${escapeHtml(formatAnswer(answers[k]))}</div></div>`).join("")}</div></div>`}
function formatAnswer(v){if(Array.isArray(v))return v.join(" / ");if(v===null||v===undefined)return "";return String(v)}
function statusLabel(status){return {draft:"下書き",open:"公開中",closed:"締切"}[status]||status||"-"}
function formatTimestamp(value){if(!value)return "";if(typeof value==="string")return value;if(value._seconds)return new Date(value._seconds*1000).toLocaleString("ja-JP");if(value.seconds)return new Date(value.seconds*1000).toLocaleString("ja-JP");return ""}
function escapeHtml(str){return String(str).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function escapeAttr(str){return escapeHtml(str)}
session=getSession();if(session){const level=getPermissionLevel(session);if(level<1){renderShell(`<div class="panel"><div class="panel-title">権限がありません</div><div class="empty">集計画面はテクニカルマネージャー以上が利用できます。</div></div>`)}else{loadResults()}}
</script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>1648 Portal 管理ページ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100%;background:#070b12;color:#fff;font-family:'Hiragino Sans','Yu Gothic',system-ui,sans-serif}
body{padding:16px;padding-bottom:28px}
.header{position:sticky;top:0;z-index:20;margin:-16px -16px 16px;padding:14px 16px;background:linear-gradient(180deg,rgba(7,11,18,.98),rgba(7,11,18,.86));border-bottom:1px solid rgba(255,255,255,.08);backdrop-filter:blur(10px)}
.topline{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-size:20px;color:#facc15;line-height:1.3}
.sub{margin-top:4px;font-size:12px;opacity:.72}
.user-card{flex-shrink:0;min-width:132px;max-width:178px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);border-radius:14px;padding:9px 10px;font-size:11px;line-height:1.45;text-align:right}
.user-name{font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.role-badge{display:inline-block;margin-top:4px;padding:3px 7px;border-radius:999px;background:rgba(250,204,21,.16);border:1px solid rgba(250,204,21,.28);color:#fde68a;font-size:10px;font-weight:900}
.back{display:inline-flex;margin-top:12px;color:#93c5fd;text-decoration:none;font-size:12px;font-weight:800}
.notice{border:1px solid rgba(251,191,36,.28);background:rgba(251,191,36,.09);color:#fde68a;border-radius:16px;padding:12px;font-size:12px;line-height:1.7;margin-bottom:14px}
.section-title{font-size:13px;color:#cbd5e1;margin:18px 2px 10px;font-weight:900}
.grid{display:flex;flex-direction:column;gap:10px}
.card{width:100%;border:none;border-radius:18px;padding:16px;text-align:left;color:#fff;background:linear-gradient(135deg,rgba(30,41,59,.96),rgba(15,23,42,.96));border:1px solid rgba(255,255,255,.12);box-shadow:0 10px 28px rgba(0,0,0,.25);font-family:inherit;cursor:pointer}
.card:active{transform:scale(.985)}
.card.disabled{opacity:.42;cursor:not-allowed}
.card.disabled:active{transform:none}
.card-title{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:900;margin-bottom:6px}
.card-desc{font-size:12px;opacity:.72;line-height:1.6}
.card .level{margin-top:10px;display:inline-block;font-size:10px;padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.1);color:#e5e7eb}
.card-survey{border-color:rgba(59,130,246,.35)}
.card-question{border-color:rgba(168,85,247,.35)}
.card-hero{border-color:rgba(34,197,94,.35)}
.card-result{border-color:rgba(245,158,11,.35)}
.card-operation{border-color:rgba(248,113,113,.35)}
.card-system{border-color:rgba(148,163,184,.35)}
.lock-screen{min-height:calc(100vh - 32px);display:flex;align-items:center;justify-content:center}
.lock-box{width:100%;max-width:420px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);border-radius:22px;padding:24px 18px;text-align:center}
.lock-box h2{color:#fca5a5;font-size:20px;margin-bottom:10px}
.lock-box p{font-size:13px;line-height:1.8;opacity:.82}
.lock-box a{display:inline-flex;margin-top:18px;padding:11px 16px;border-radius:999px;background:rgba(59,130,246,.18);color:#bfdbfe;text-decoration:none;font-weight:900;font-size:13px}
.footer-note{margin-top:18px;font-size:11px;line-height:1.7;opacity:.55}
</style>
</head>
<body>
<div id="app"></div>
<script>
const LOGIN_URL="https://discord.com/oauth2/authorize?client_id=1514478819799470080&response_type=code&redirect_uri=https%3A%2F%2Fkekj12kek-sudo.github.io%2F1648-portal%2Fauth%2Fcallback%2F&scope=identify";
const PORTAL_URL="/1648-portal/";
function getSession(){const raw=localStorage.getItem("discord_user");if(!raw){window.location.replace(LOGIN_URL);return null}try{const data=JSON.parse(raw);if(!data.ok){localStorage.removeItem("discord_user");window.location.replace(LOGIN_URL);return null}if(data.status==="pending_profile"){window.location.replace("/1648-portal/profile-setup/");return null}if(data.status!=="active"){localStorage.removeItem("discord_user");window.location.replace(LOGIN_URL);return null}return data}catch(e){localStorage.removeItem("discord_user");window.location.replace(LOGIN_URL);return null}}
function getPermissionLevel(data){const discordId=data?.user?.discordId||data?.discord?.id||data?.discordId||"";if(discordId==="795152243883114527"){return 3}const role=data?.role||data?.user?.role||"member";const levelMap={developer:3,manager:2,technical:1,member:0};return levelMap[role]??0}
function getRoleLabel(level){if(level>=3)return"HQディベロッパー";if(level>=2)return"HQマネージャー";if(level>=1)return"テクニカルマネージャー";return"HQメンバー"}
function getUserName(data){return data?.user?.playerName||data?.discord?.globalName||data?.discord?.username||data?.user?.discordName||"メンバー"}
function renderLocked(){document.getElementById("app").innerHTML=`<div class="lock-screen"><div class="lock-box"><h2>管理ページは利用できません</h2><p>このページはテクニカルマネージャー以上の権限が必要です。<br>通常機能はPortalホームから利用できます。</p><a href="${PORTAL_URL}">Portalへ戻る</a></div></div>`}
function renderAdmin(data,level){const name=escapeHtml(getUserName(data));const roleLabel=escapeHtml(getRoleLabel(level));document.getElementById("app").innerHTML=`
<div class="header"><div class="topline"><div><h1>1648 Portal 管理ページ</h1><div class="sub">アンケート・質問カード・英雄カード管理</div></div><div class="user-card"><div class="user-name">${name}</div><div class="role-badge">${roleLabel}</div></div></div><a class="back" href="${PORTAL_URL}">← Portalへ戻る</a></div>
<div class="notice">現在は管理ページの土台です。Discordロール連携後は、階級ロールに応じて表示・操作範囲を自動制御します。</div>
<div class="section-title">アンケート管理</div><div class="grid">${adminCard("📝","アンケート作成","質問カード・英雄カード・自由質問を組み合わせてアンケートを作成します。",1,level,"card-survey")}${adminCard("📊","回答集計","公開済みアンケートの回答状況と集計結果を確認します。",1,level,"card-result")}</div>
<div class="section-title">カード管理</div><div class="grid">${adminCard("🧩","質問カード管理","T12状況・参戦時間・集結容量など、再利用する質問カードを管理します。",1,level,"card-question")}${adminCard("🦸","英雄カード管理","資料館の英雄画像・詳細URLを参照する英雄カードを管理します。",1,level,"card-hero")}</div>
<div class="section-title">運営管理</div><div class="grid">${adminCard("🏛","官職予約管理","官職予約の作成・確定・結果確認を行います。",2,level,"card-operation")}${adminCard("🗂","戦力DB","アンケート回答から更新された戦力情報を確認します。",2,level,"card-operation")}</div>
<div class="section-title">システム</div><div class="grid">${adminCard("⚙","システム設定","ロール連携・DB設定など開発者向け設定です。",3,level,"card-system")}</div>
<div class="footer-note">権限階級：HQディベロッパー ＞ HQマネージャー ＞ テクニカルマネージャー ＞ HQメンバー</div>`;document.querySelectorAll("[data-locked='true']").forEach(el=>{el.addEventListener("click",()=>alert("この機能を利用する権限がありません。"))});document.querySelectorAll("[data-coming='true']").forEach(el=>{el.addEventListener("click",()=>alert("この機能は次の実装で追加します。"))})}
function adminCard(icon,title,desc,requiredLevel,currentLevel,className){const locked=currentLevel<requiredLevel;return`<button class="card ${className} ${locked?"disabled":""}" data-locked="${locked?"true":"false"}" data-coming="${locked?"false":"true"}"><div class="card-title"><span>${icon}</span><span>${escapeHtml(title)}</span></div><div class="card-desc">${escapeHtml(desc)}</div><span class="level">必要権限：${escapeHtml(getRoleLabel(requiredLevel))}以上</span></button>`}
function escapeHtml(str){return String(str).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
const session=getSession();if(session){const level=getPermissionLevel(session);if(level<1){renderLocked()}else{renderAdmin(session,level)}}
</script>
</body>
</html>

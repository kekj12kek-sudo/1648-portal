<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>1648 Portal 管理ページ</title><style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;min-height:100%;background:#070b12;color:#fff;font-family:'Hiragino Sans','Yu Gothic',system-ui,sans-serif}body{padding:16px}.header{position:sticky;top:0;z-index:20;margin:-16px -16px 16px;padding:14px 16px;background:rgba(7,11,18,.96);border-bottom:1px solid rgba(255,255,255,.08);backdrop-filter:blur(10px)}h1{font-size:20px;color:#facc15}.sub{font-size:12px;opacity:.72;margin-top:4px}.back{display:inline-flex;margin-top:12px;color:#93c5fd;text-decoration:none;font-size:12px;font-weight:800}.notice{border:1px solid rgba(251,191,36,.28);background:rgba(251,191,36,.09);color:#fde68a;border-radius:16px;padding:12px;font-size:12px;line-height:1.7;margin-bottom:14px}.section-title{font-size:13px;color:#cbd5e1;margin:18px 2px 10px;font-weight:900}.grid{display:flex;flex-direction:column;gap:10px}.card{width:100%;border:none;border-radius:18px;padding:16px;text-align:left;color:#fff;background:linear-gradient(135deg,rgba(30,41,59,.96),rgba(15,23,42,.96));border:1px solid rgba(255,255,255,.12);font-family:inherit;cursor:pointer;text-decoration:none;display:block}.card-title{font-size:16px;font-weight:900;margin-bottom:6px}.card-desc{font-size:12px;opacity:.72;line-height:1.6}.level{margin-top:10px;display:inline-block;font-size:10px;padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.1);color:#e5e7eb}.disabled{opacity:.42}.lock{padding:24px;text-align:center}.lock a{color:#bfdbfe}</style></head><body><div id="app"></div><script>
const LOGIN_URL="https://discord.com/oauth2/authorize?client_id=1514478819799470080&response_type=code&redirect_uri=https%3A%2F%2Fkekj12kek-sudo.github.io%2F1648-portal%2Fauth%2Fcallback%2F&scope=identify",PORTAL_URL="/1648-portal/";
function sess(){const r=localStorage.getItem("discord_user");if(!r){location.replace(LOGIN_URL);return null}try{const d=JSON.parse(r);if(!d.ok){localStorage.removeItem("discord_user");location.replace(LOGIN_URL);return null}if(d.status==="pending_profile"){location.replace("/1648-portal/profile-setup/");return null}if(d.status!=="active"){localStorage.removeItem("discord_user");location.replace(LOGIN_URL);return null}return d}catch(e){localStorage.removeItem("discord_user");location.replace(LOGIN_URL);return null}}
function roleKey(d){return String(d?.role||d?.user?.role||"member").toLowerCase()}
function isLimited(d){return roleKey(d)==="limited"}
function limitedHtml(){return `<div class="lock"><div style="font-size:42px;margin-bottom:10px">🔒</div><div style="font-size:18px;font-weight:900;color:#facc15;margin-bottom:8px">利用制限中</div><div style="font-size:13px;color:#94a3b8;line-height:1.7;margin-bottom:16px">現在利用できる機能はコスト計算roomのみです。</div><a style="display:flex;align-items:center;justify-content:center;height:44px;border-radius:12px;background:#7c3aed;color:#fff;text-decoration:none;font-weight:900;margin-bottom:10px" href="/1648-portal/cost/">コスト計算roomへ</a><a href="/1648-portal/">Portalへ戻る</a></div>`}
function level(d){return {developer:3,manager:2,technical:1,member:0,limited:-1}[roleKey(d)]??0}
function role(l){return l>=3?"developer":l>=2?"manager":l>=1?"technical":"member"}
function card(icon,t,desc,req,l,url){const locked=l<req,tag=url&&!locked?"a":"button",href=url&&!locked?`href="${url}"`:"";return `<${tag} class="card ${locked?"disabled":""}" ${href} data-coming="${!url&&!locked}"><div class="card-title">${icon} ${t}</div><div class="card-desc">${desc}</div><span class="level">必要権限：${role(req)}以上</span></${tag}>`}
const s=sess();if(s){if(isLimited(s)){app.innerHTML=limitedHtml()}else{const l=level(s);if(l<1){app.innerHTML=`<div class="lock">管理ページは利用できません<br><a href="${PORTAL_URL}">Portalへ戻る</a></div>`}else{app.innerHTML=`<div class="header"><h1>1648 Portal 管理ページ</h1><div class="sub">${role(l)}</div><a class="back" href="${PORTAL_URL}">← Portalへ戻る</a></div><div class="notice">スマートフォンでは管理ダッシュボードから必要な情報を確認できます。全項目の詳細確認はPCでスプレッドシートをご利用ください。</div><div class="section-title">管理ダッシュボード</div><div class="grid">${card("📊","管理ダッシュボード","Portal参加者・データ検索・アンケート結果・官職結果をスマホ向けに確認します。",2,l,"/1648-portal/admin/dashboard/")}</div><div class="section-title">アンケート管理</div><div class="grid">${card("📝","アンケート作成","質問ストックから選んでアンケートを作成します。",1,l,"/1648-portal/admin/surveys/")}</div><div class="section-title">カード管理</div><div class="grid">${card("🧩","質問カード管理","よく使う質問をストックします。",1,l,"/1648-portal/admin/questions/")}${card("🦸","英雄カード管理","英雄画像カードを管理します。",1,l,"")}</div><div class="section-title">運営管理</div><div class="grid">${card("🏛","官職予約管理","官職予約の作成・確定・結果確認を行います。",2,l,"/1648-portal/admin/office/")}${card("🚚","移民管理","サーバー別に移民候補・移民予定・注意情報を管理します。",2,l,"")}</div><div class="section-title">全項目一覧</div><div class="grid">${card("📄","全項目一覧（PC推奨）","全データの確認・並び替え・分析用スプレッドシートです。スマートフォンでは管理ダッシュボードをご利用ください。",1,l,"https://docs.google.com/spreadsheets/d/1QOIAg_zG_Fyl7NPACVy3Ew_2HbVP-oYyAl6AWw5K9rw/edit?usp=sharing")}</div>`;document.querySelectorAll("[data-coming='true']").forEach(e=>e.onclick=()=>alert("この機能は次の実装で追加します。"))}}}
</script></body></html>

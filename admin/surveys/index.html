<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>アンケート作成</title><style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;min-height:100%;background:#070b12;color:#fff;font-family:'Hiragino Sans','Yu Gothic',system-ui,sans-serif}body{padding:16px;padding-bottom:32px}.header{position:sticky;top:0;z-index:20;margin:-16px -16px 16px;padding:14px 16px;background:rgba(7,11,18,.96);border-bottom:1px solid rgba(255,255,255,.08)}h1{font-size:20px;color:#60a5fa}.sub{font-size:12px;opacity:.75;line-height:1.7;margin-top:4px}.back{display:inline-flex;margin-top:12px;color:#93c5fd;text-decoration:none;font-size:12px;font-weight:800}.panel{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);border-radius:18px;padding:14px;margin-bottom:14px}.panel-title{font-size:16px;font-weight:900;margin-bottom:10px;color:#bfdbfe}label{display:block;font-size:13px;font-weight:900;margin:14px 0 7px;color:#e5e7eb}input,textarea{width:100%;border-radius:13px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);color:#fff;font-size:16px;padding:12px;outline:none;font-family:inherit}textarea{min-height:70px;resize:vertical}.help{border:1px solid rgba(96,165,250,.25);background:rgba(59,130,246,.08);color:#bfdbfe;border-radius:14px;padding:11px 12px;font-size:12px;line-height:1.7;margin-bottom:14px}.stock-list,.selected-list,.survey-list{display:flex;flex-direction:column;gap:8px}.stock-item{display:flex;gap:10px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.06);border-radius:14px;padding:11px}.stock-item input{width:19px;height:19px;margin-top:2px}.stock-title{font-size:14px;font-weight:900}.stock-desc{font-size:11px;opacity:.68;line-height:1.6;margin-top:3px}.badge{display:inline-block;margin-top:6px;border-radius:999px;padding:3px 7px;font-size:10px;font-weight:900;background:rgba(255,255,255,.1);color:#e5e7eb}.selected-box{border:1px solid rgba(34,197,94,.24);background:rgba(34,197,94,.06);border-radius:16px;padding:12px;margin-top:12px}.selected-title{font-size:13px;font-weight:900;color:#86efac;margin-bottom:8px}.selected-row{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.18);border-radius:12px;padding:9px;font-size:13px}.move-btns{display:flex;gap:5px}.move-btns button{border:none;border-radius:9px;background:rgba(255,255,255,.12);color:#fff;font-weight:900;padding:6px 8px}.btn{width:100%;min-height:52px;margin-top:14px;border:none;border-radius:15px;background:linear-gradient(135deg,#2563eb,#60a5fa);color:#fff;font-size:16px;font-weight:900}.btn-secondary{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#e5e7eb}.msg{font-size:12px;line-height:1.7;margin-top:10px;text-align:center}.ok{color:#86efac}.error{color:#fca5a5}.empty{font-size:13px;line-height:1.7;opacity:.72;text-align:center;padding:20px 8px}.survey-card{border:1px solid rgba(255,255,255,.13);background:rgba(15,23,42,.95);border-radius:16px;padding:13px}.survey-title{font-size:15px;font-weight:900}.survey-meta{font-size:11px;opacity:.66;margin-top:5px}.status{display:inline-block;margin-top:8px;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:900;background:rgba(255,255,255,.1)}.status.open{background:rgba(34,197,94,.18);color:#bbf7d0}</style></head><body><div id="app"></div><script>
const LOGIN_URL="https://discord.com/oauth2/authorize?client_id=1514478819799470080&response_type=code&redirect_uri=https%3A%2F%2Fkekj12kek-sudo.github.io%2F1648-portal%2Fauth%2Fcallback%2F&scope=identify",ADMIN_URL="/1648-portal/admin/",LIST_Q_URL="https://us-central1-yoyaku-4ec7c.cloudfunctions.net/listQuestionCards",SAVE_SURVEY_URL="https://us-central1-yoyaku-4ec7c.cloudfunctions.net/saveSurveyRoom",LIST_SURVEY_URL="https://us-central1-yoyaku-4ec7c.cloudfunctions.net/listSurveyRooms";
let session=null,questionCards=[],selectedQuestions=[];
function sess(){const r=localStorage.getItem("discord_user");if(!r){location.replace(LOGIN_URL);return null}try{const d=JSON.parse(r);if(!d.ok){localStorage.removeItem("discord_user");location.replace(LOGIN_URL);return null}if(d.status==="pending_profile"){location.replace("/1648-portal/profile-setup/");return null}if(d.status!=="active"){localStorage.removeItem("discord_user");location.replace(LOGIN_URL);return null}return d}catch(e){localStorage.removeItem("discord_user");location.replace(LOGIN_URL);return null}}
function did(){return session?.user?.discordId||session?.discord?.id||session?.discordId||""}function level(d){const id=d?.user?.discordId||d?.discord?.id||d?.discordId||"";if(id==="795152243883114527")return 3;return {developer:3,manager:2,technical:1,member:0}[d?.role||d?.user?.role||"member"]??0}
function render(){app.innerHTML=`<div class="header"><h1>アンケート作成</h1><div class="sub">質問ストックから選んで、回答者向けアンケートを作ります。</div><a class="back" href="${ADMIN_URL}">← 管理ページへ戻る</a></div><div class="panel"><div class="panel-title">新しいアンケート</div><div class="help">管理者は「アンケート名」と「使う質問」を選ぶだけです。保存先やDB更新は裏側で処理します。</div><label>アンケート名</label><input id="surveyTitle" placeholder="例：SVS戦力調査"><label>メモ・補足</label><textarea id="surveyNote" placeholder="例：次回SVSに向けた確認です"></textarea><label>質問ストックから選ぶ</label><div id="stockList" class="stock-list"><div class="empty">読み込み中...</div></div><div class="selected-box"><div class="selected-title">このアンケートに入れる質問</div><div id="selectedList" class="selected-list"><div class="empty">まだ選択されていません。</div></div></div><button class="btn" id="saveDraftBtn">下書き保存</button><button class="btn btn-secondary" id="saveOpenBtn">保存して公開</button><div id="msg" class="msg"></div></div><div class="panel"><div class="panel-title">作成済みアンケート</div><div id="surveyList" class="survey-list"><div class="empty">読み込み中...</div></div></div>`;saveDraftBtn.onclick=()=>saveSurvey("draft");saveOpenBtn.onclick=()=>saveSurvey("open");loadQuestions();loadSurveys()}
async function loadQuestions(){try{const res=await fetch(LIST_Q_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({discordId:did()})});const data=await res.json();if(!res.ok||!data.ok)throw new Error(data.error||"load_failed");questionCards=data.cards||[];if(!questionCards.length){stockList.innerHTML=`<div class="empty">質問カードがありません。先に質問カード管理で作成してください。</div>`;return}stockList.innerHTML=questionCards.map(c=>`<label class="stock-item"><input type="checkbox" data-qid="${esc(c.id)}"><div><div class="stock-title">${h(c.title)}</div>${c.description?`<div class="stock-desc">${h(c.description)}</div>`:""}<span class="badge">${typeLabel(c.type)}</span></div></label>`).join("");document.querySelectorAll("[data-qid]").forEach(ch=>ch.onchange=()=>toggle(ch.dataset.qid,ch.checked))}catch(e){stockList.innerHTML=`<div class="empty error">読み込み失敗：${h(e.message)}</div>`}}
function toggle(id,checked){if(checked){if(!selectedQuestions.includes(id))selectedQuestions.push(id)}else selectedQuestions=selectedQuestions.filter(v=>v!==id);renderSel()}function renderSel(){if(!selectedQuestions.length){selectedList.innerHTML=`<div class="empty">まだ選択されていません。</div>`;return}selectedList.innerHTML=selectedQuestions.map((id,i)=>{const c=questionCards.find(x=>x.id===id);return `<div class="selected-row"><span>${h(c?.title||id)}</span><div class="move-btns"><button onclick="mv(${i},-1)">↑</button><button onclick="mv(${i},1)">↓</button></div></div>`}).join("")}
window.mv=(i,d)=>{const n=i+d;if(n<0||n>=selectedQuestions.length)return;[selectedQuestions[i],selectedQuestions[n]]=[selectedQuestions[n],selectedQuestions[i]];renderSel()}
async function saveSurvey(status){if(!surveyTitle.value.trim()){msg.className="msg error";msg.textContent="アンケート名を入力してください。";return}if(!selectedQuestions.length){msg.className="msg error";msg.textContent="質問を1つ以上選択してください。";return}msg.className="msg";msg.textContent="保存中...";try{const survey={title:surveyTitle.value.trim(),note:surveyNote.value.trim(),status,questionCards:selectedQuestions,heroCards:[],freeQuestions:[],targetAllianceCodes:[]};const res=await fetch(SAVE_SURVEY_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({discordId:did(),survey})});const data=await res.json();if(!res.ok||!data.ok)throw new Error(data.error||"save_failed");msg.className="msg ok";msg.textContent=status==="open"?"公開しました。":"下書き保存しました。";surveyTitle.value="";surveyNote.value="";selectedQuestions=[];document.querySelectorAll("[data-qid]").forEach(ch=>ch.checked=false);renderSel();loadSurveys()}catch(e){msg.className="msg error";msg.textContent="保存失敗："+e.message}}
async function loadSurveys(){try{const res=await fetch(LIST_SURVEY_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({discordId:did()})});const data=await res.json();if(!res.ok||!data.ok)throw new Error(data.error||"load_failed");if(!data.surveys.length){surveyList.innerHTML=`<div class="empty">まだ作成済みアンケートはありません。</div>`;return}surveyList.innerHTML=data.surveys.map(s=>`<div class="survey-card"><div class="survey-title">${h(s.title)}</div><div class="survey-meta">質問数：${(s.questionCards||[]).length} / 回答数：${s.answerCount||0}</div><span class="status ${s.status}">${statusLabel(s.status)}</span></div>`).join("")}catch(e){surveyList.innerHTML=`<div class="empty error">読み込み失敗：${h(e.message)}</div>`}}
function typeLabel(t){return {single_select:"1つだけ選択",multi_select:"複数選択",number:"数字入力",text:"文章入力"}[t]||t}function statusLabel(s){return {draft:"下書き",open:"公開中",closed:"締切"}[s]||s}function h(s){return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}function esc(s){return h(s)}
session=sess();if(session){if(level(session)<1)app.innerHTML=`<div class="panel"><div class="panel-title">権限がありません</div><a class="back" href="${ADMIN_URL}">← 管理ページへ戻る</a></div>`;else render()}
</script></body></html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>質問カード管理</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100%;background:#070b12;color:#fff;font-family:'Hiragino Sans','Yu Gothic',system-ui,sans-serif}
body{padding:16px 16px 32px}
.header{position:sticky;top:0;z-index:20;margin:-16px -16px 16px;padding:14px 16px;background:linear-gradient(180deg,rgba(7,11,18,.98),rgba(7,11,18,.86));border-bottom:1px solid rgba(255,255,255,.08);backdrop-filter:blur(10px)}
h1{font-size:20px;color:#c084fc}
.sub{margin-top:4px;font-size:12px;opacity:.75;line-height:1.7}
.back{display:inline-flex;margin-top:12px;color:#93c5fd;text-decoration:none;font-size:12px;font-weight:800}
.panel{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);border-radius:18px;padding:14px;margin-bottom:14px}
.panel-title{font-size:16px;font-weight:900;margin-bottom:10px;color:#e9d5ff}
.help-box{border:1px solid rgba(96,165,250,.25);background:rgba(59,130,246,.08);color:#bfdbfe;border-radius:14px;padding:11px 12px;font-size:12px;line-height:1.7;margin-bottom:14px}
label{display:block;font-size:13px;font-weight:900;margin:14px 0 7px;color:#e5e7eb}
input,textarea,select{width:100%;border-radius:13px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);color:#fff;font-size:16px;padding:12px;outline:none;font-family:inherit}
select option{color:#111827}
textarea{min-height:92px;resize:vertical;line-height:1.6}
.type-grid{display:grid;grid-template-columns:1fr;gap:8px}
.type-btn{display:flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);border-radius:14px;padding:12px;cursor:pointer}
.type-btn.active{border-color:rgba(192,132,252,.8);background:rgba(126,34,206,.22)}
.type-btn input{width:18px;height:18px;flex-shrink:0}
.type-name{font-size:14px;font-weight:900}
.type-desc{font-size:11px;opacity:.68;margin-top:2px}
.dynamic-box{margin-top:14px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.045);border-radius:16px;padding:13px}
.dynamic-title{font-size:14px;font-weight:900;color:#fde68a;margin-bottom:6px}
.dynamic-desc{font-size:12px;line-height:1.7;opacity:.78;margin-bottom:10px}
.option-list{display:flex;flex-direction:column;gap:8px}
.option-row{display:flex;gap:8px;align-items:center}
.option-row input{flex:1}
.option-remove{width:42px;height:42px;border:none;border-radius:12px;background:rgba(248,113,113,.16);color:#fecaca;font-weight:900;font-size:18px}
.add-option{width:100%;margin-top:10px;border:none;border-radius:13px;background:rgba(59,130,246,.18);color:#bfdbfe;font-size:13px;font-weight:900;padding:11px}
.example-box{border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.18);border-radius:12px;padding:11px;font-size:12px;line-height:1.7;color:#cbd5e1}
.image-placeholder{border:1px dashed rgba(255,255,255,.25);background:rgba(255,255,255,.04);border-radius:14px;padding:14px;font-size:12px;line-height:1.7;color:#cbd5e1}
.preview{border:1px solid rgba(34,197,94,.24);background:rgba(34,197,94,.06);border-radius:18px;padding:14px;margin-top:14px}
.preview-head{font-size:13px;font-weight:900;color:#86efac;margin-bottom:10px}
.preview-card{border:1px solid rgba(255,255,255,.13);background:rgba(0,0,0,.22);border-radius:16px;padding:13px}
.preview-title{font-size:16px;font-weight:900;margin-bottom:6px}
.preview-body{font-size:13px;line-height:1.7;opacity:.82;margin:10px 0 12px}
.choice{display:flex;align-items:center;gap:9px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);border-radius:12px;padding:10px;margin-top:8px;font-size:14px}
.fake-radio,.fake-check{width:18px;height:18px;border:2px solid rgba(255,255,255,.45);flex-shrink:0}
.fake-radio{border-radius:50%}
.fake-check{border-radius:5px}
.fake-input{height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);display:flex;align-items:center;padding:0 12px;color:rgba(255,255,255,.5)}
.set-preview-row{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center;margin-top:8px}
.set-preview-label{font-size:13px;font-weight:900;color:#bfdbfe}
.unit-preview{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px}
.unit-chip{min-width:42px;height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fde68a;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:950;padding:0 10px}
.time-preview{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.time-sep{color:#cbd5e1;font-size:14px;font-weight:900}
.category-badge{display:inline-block;border-radius:999px;padding:4px 7px;font-size:10px;font-weight:900;background:rgba(59,130,246,.16);color:#bfdbfe;margin-top:4px}
.btn{width:100%;min-height:52px;margin-top:14px;border:none;border-radius:15px;background:linear-gradient(135deg,#7c3aed,#c084fc);color:#fff;font-size:16px;font-weight:900;cursor:pointer}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-secondary{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#e5e7eb}
.msg{font-size:12px;line-height:1.7;margin-top:10px;text-align:center}
.ok{color:#86efac}
.error{color:#fca5a5}
.card-list{display:flex;flex-direction:column;gap:10px}
.q-card{border:1px solid rgba(255,255,255,.13);background:linear-gradient(135deg,rgba(30,41,59,.95),rgba(15,23,42,.95));border-radius:16px;padding:13px}
.q-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.q-title{font-size:15px;font-weight:900;line-height:1.4}
.q-meta{font-size:10px;opacity:.65;margin-top:4px}
.q-desc{font-size:12px;line-height:1.6;opacity:.75;margin-top:8px}
.q-options{font-size:11px;line-height:1.6;margin-top:8px;color:#bfdbfe}
.q-actions{display:flex;gap:8px;margin-top:10px}
.small-btn{border:none;border-radius:999px;padding:8px 11px;font-size:11px;font-weight:900;cursor:pointer}
.edit{background:rgba(59,130,246,.18);color:#bfdbfe}
.delete{background:rgba(248,113,113,.16);color:#fecaca}
.badge{display:inline-block;border-radius:999px;padding:4px 7px;font-size:10px;font-weight:900;background:rgba(255,255,255,.1);color:#e5e7eb;white-space:nowrap}
.empty{font-size:13px;line-height:1.7;opacity:.72;text-align:center;padding:20px 8px}
@media(min-width:700px){.type-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const LOGIN_URL="https://discord.com/oauth2/authorize?client_id=1514478819799470080&response_type=code&redirect_uri=https%3A%2F%2Fkekj12kek-sudo.github.io%2F1648-portal%2Fauth%2Fcallback%2F&scope=identify";
const ADMIN_URL="/1648-portal/admin/";
const SAVE_URL="https://us-central1-yoyaku-4ec7c.cloudfunctions.net/saveQuestionCard";
const LIST_URL="https://us-central1-yoyaku-4ec7c.cloudfunctions.net/listQuestionCards";
const DELETE_URL="https://us-central1-yoyaku-4ec7c.cloudfunctions.net/deleteQuestionCard";

let session=null;
let editingCardId="";
let optionValues=[""];
let setItems=[];

const SET_PRESETS={
  fc_barracks:{
    category:"fc",
    setKind:"fc_barracks",
    items:[{id:"shield",label:"盾兵舎"},{id:"spear",label:"槍兵舎"},{id:"bow",label:"弓兵舎"}],
    options:["FC10","FC9","FC8","FC7"]
  },
  tier_troops:{
    category:"tier",
    setKind:"tier_troops",
    items:[{id:"shield",label:"盾兵"},{id:"spear",label:"槍兵"},{id:"bow",label:"弓兵"}],
    options:["T12","T11","T10"]
  },
  t12_status:{
    category:"t12",
    setKind:"t12_status",
    items:[{id:"shield",label:"盾T12"},{id:"spear",label:"槍T12"},{id:"bow",label:"弓T12"}],
    options:["未解放","T12解放済","スキル3済","容量MAX済","カンスト"]
  }
};

function getSession(){
  const raw=localStorage.getItem("discord_user");
  if(!raw){location.replace(LOGIN_URL);return null}
  try{
    const d=JSON.parse(raw);
    if(!d.ok){localStorage.removeItem("discord_user");location.replace(LOGIN_URL);return null}
    if(d.status==="pending_profile"){location.replace("/1648-portal/profile-setup/");return null}
    if(d.status!=="active"){localStorage.removeItem("discord_user");location.replace(LOGIN_URL);return null}
    return d;
  }catch(e){
    localStorage.removeItem("discord_user");
    location.replace(LOGIN_URL);
    return null;
  }
}

function getDiscordId(){
  return session?.user?.discordId||session?.discord?.id||session?.discordId||"";
}

function getPermissionLevel(d){
  const id=d?.user?.discordId||d?.discord?.id||d?.discordId||"";
  if(id==="795152243883114527")return 3;
  return ({developer:3,manager:2,technical:1,member:0})[d?.role||d?.user?.role||"member"]??0;
}

function typeRadio(value,title,desc){
  return `<label class="type-btn" data-type-wrap="${value}">
    <input type="radio" name="answerType" value="${value}" ${value==="single_select"?"checked":""}>
    <div><div class="type-name">${title}</div><div class="type-desc">${desc}</div></div>
  </label>`;
}

function render(){
  document.getElementById("app").innerHTML=`
    <div class="header">
      <h1>質問カード管理</h1>
      <div class="sub">よく使う質問をストックします。<br>アンケート作成時に、この一覧から選んで使えます。</div>
      <a class="back" href="${ADMIN_URL}">← 管理ページへ戻る</a>
    </div>

    <div class="panel">
      <div class="panel-title" id="formTitle">新しい質問を作る</div>
      <div class="help-box">
        FC＝施設レベル、ティア＝兵質、T12＝研究進捗として分けて管理します。<br>
        盾・槍・弓などをまとめて聞く場合は「セット質問」を使います。
      </div>

      <label for="category">カテゴリー</label>
      <select id="category">
        <option value="general">自由質問</option>
        <option value="fc">FC</option>
        <option value="tier">ティア</option>
        <option value="t12">T12</option>
        <option value="hero">英雄育成</option>
        <option value="pet">ペット</option>
        <option value="power">戦力</option>
        <option value="time">参加時間</option>
        <option value="office">官職予約</option>
      </select>

      <label for="title">質問タイトル</label>
      <input id="title" placeholder="例：盾・槍・弓兵舎のFCレベルについて">

      <label for="content">質問内容</label>
      <textarea id="content" placeholder="例：現在の盾兵舎・槍兵舎・弓兵舎のFCレベルを選択してください"></textarea>

      <label>回答方式</label>
      <div class="type-grid">
        ${typeRadio("single_select","1つだけ選択","選択肢の中から1つだけ選ばせる")}
        ${typeRadio("multi_select","複数選択","当てはまるものを複数選ばせる")}
        ${typeRadio("set_select","セット質問","盾・槍・弓などを1セットで回答させる")}
        ${typeRadio("number","数字で入力","出征数・容量など数字だけ入力させる")}
        ${typeRadio("number_unit","数字＋単位","数字入力に「人」「万」などの単位を付ける")}
        ${typeRadio("time_select","時間プルダウン","21:00などの時刻を選ばせる")}
        ${typeRadio("time_range","時間範囲","開始時刻〜終了時刻を選ばせる")}
        ${typeRadio("time_hm","時:分入力","時と分を分けて選ばせる")}
        ${typeRadio("hero_multi","英雄カード選択","英雄カードから複数選択させる")}
        ${typeRadio("text","文章で入力","連絡事項や補足を書かせる")}
      </div>

      <div id="dynamicArea"></div>

      <label>入力例 / プレースホルダー</label>
      <input id="placeholder" placeholder="例：1439710 / 21:00 / FC10">
      <div class="sub">回答欄の薄い入力例として表示されます。</div>

      <label>画像</label>
      <div class="image-placeholder">
        画像アップロードは次の工程で追加します。<br>
        英雄カードは英雄管理画面から登録済みのカードを使用します。
      </div>

      <div class="preview">
        <div class="preview-head">回答者にはこう表示されます</div>
        <div id="answerPreview"></div>
      </div>

      <button class="btn" id="saveBtn">保存する</button>
      <button class="btn btn-secondary" id="resetBtn" type="button">入力をリセット</button>
      <div id="msg" class="msg"></div>
    </div>

    <div class="panel">
      <div class="panel-title">質問ストック</div>
      <div id="cardList" class="card-list"><div class="empty">読み込み中...</div></div>
    </div>
  `;

  document.querySelectorAll("input[name='answerType']").forEach(r=>{
    r.addEventListener("change",()=>{
      refreshTypeUI();
      renderDynamicArea();
      renderPreview();
    });
  });

  ["title","content","placeholder","category"].forEach(id=>{
    const el=document.getElementById(id);
    if(!el)return;
    el.addEventListener("input",renderPreview);
    el.addEventListener("change",()=>{
      if(id==="category"&&getSelectedType()==="set_select"){
        applySetPreset(inferSetKind());
      }
      renderPreview();
    });
  });

  document.getElementById("saveBtn").addEventListener("click",saveCard);
  document.getElementById("resetBtn").addEventListener("click",resetForm);

  refreshTypeUI();
  renderDynamicArea();
  renderPreview();
  loadCards();
}

function getSelectedType(){
  return document.querySelector("input[name='answerType']:checked")?.value||"text";
}

function refreshTypeUI(){
  const t=getSelectedType();
  document.querySelectorAll("[data-type-wrap]").forEach(el=>{
    el.classList.toggle("active",el.dataset.typeWrap===t);
  });
}

function inferSetKind(){
  const cat=document.getElementById("category")?.value||"general";
  if(cat==="fc")return "fc_barracks";
  if(cat==="tier")return "tier_troops";
  if(cat==="t12")return "t12_status";
  return "fc_barracks";
}

function applySetPreset(kind){
  const p=SET_PRESETS[kind]||SET_PRESETS.fc_barracks;
  setItems=p.items.map(x=>({...x}));
  optionValues=[...p.options];
  const cat=document.getElementById("category");
  if(cat)cat.value=p.category;
}

function renderDynamicArea(){
  const t=getSelectedType();
  const a=document.getElementById("dynamicArea");

  if(t==="single_select"||t==="multi_select"||t==="time_select"){
    const title=t==="time_select"?"時間選択肢":"選択肢";
    const desc=t==="time_select"
      ?"未入力の場合は0:00〜23:30を30分刻みで自動生成します。必要ならここで時間を指定できます。"
      :"回答者が選ぶ項目です。必要な分だけ追加してください。";

    a.innerHTML=`<div class="dynamic-box">
      <div class="dynamic-title">${title}</div>
      <div class="dynamic-desc">${desc}</div>
      <div id="optionList" class="option-list"></div>
      <button class="add-option" type="button" id="addOptionBtn">＋ 選択肢を追加</button>
    </div>`;
    renderOptionRows();
    document.getElementById("addOptionBtn").addEventListener("click",()=>{
      syncOptionValues();
      optionValues.push("");
      renderOptionRows();
      renderPreview();
    });
    return;
  }

  if(t==="set_select"){
    if(!setItems.length)applySetPreset(inferSetKind());
    a.innerHTML=`<div class="dynamic-box">
      <div class="dynamic-title">セット質問</div>
      <div class="dynamic-desc">盾・槍・弓など、同じ選択肢で複数項目を回答させます。</div>
      <label>セット種別</label>
      <select id="setKind">
        <option value="fc_barracks">FC：盾・槍・弓兵舎</option>
        <option value="tier_troops">ティア：盾・槍・弓兵</option>
        <option value="t12_status">T12：盾・槍・弓研究</option>
      </select>
      <label>セット項目</label>
      <div class="example-box" id="setItemDisplay"></div>
      <label>選択肢</label>
      <div id="optionList" class="option-list"></div>
      <button class="add-option" type="button" id="addOptionBtn">＋ 選択肢を追加</button>
    </div>`;
    document.getElementById("setKind").value=inferSetKind();
    document.getElementById("setKind").addEventListener("change",e=>{
      applySetPreset(e.target.value);
      renderDynamicArea();
      renderPreview();
    });
    document.getElementById("setItemDisplay").innerHTML=setItems
      .map(x=>`${escapeHtml(x.label)} <span style="opacity:.55">(${escapeHtml(x.id)})</span>`)
      .join("<br>");
    renderOptionRows();
    document.getElementById("addOptionBtn").addEventListener("click",()=>{
      syncOptionValues();
      optionValues.push("");
      renderOptionRows();
      renderPreview();
    });
    return;
  }

  if(t==="number_unit"){
    a.innerHTML=`<div class="dynamic-box">
      <div class="dynamic-title">数字＋単位の質問です</div>
      <div class="dynamic-desc">回答者は数字を入力し、右側に単位が表示されます。</div>
      <label for="unit">単位</label>
      <input id="unit" placeholder="例：人 / 万 / Lv / %" value="">
      <div class="example-box">例：最大出征数<br>単位：人<br>入力例：197710</div>
    </div>`;
    document.getElementById("unit").addEventListener("input",renderPreview);
    return;
  }

  if(t==="time_range"||t==="time_hm"){
    a.innerHTML=`<div class="dynamic-box">
      <div class="dynamic-title">時間入力の質問です</div>
      <div class="dynamic-desc">参加可能時間や希望時間の確認に使います。</div>
      <label for="timeStep">時間間隔</label>
      <select id="timeStep">
        <option value="10">10分</option>
        <option value="15">15分</option>
        <option value="30" selected>30分</option>
        <option value="60">60分</option>
      </select>
      <label for="startHour">開始時</label>
      <input id="startHour" type="number" min="0" max="23" value="0">
      <label for="endHour">終了時</label>
      <input id="endHour" type="number" min="0" max="23" value="23">
      <div class="example-box">例：21:00〜23:00</div>
    </div>`;
    ["timeStep","startHour","endHour"].forEach(id=>{
      document.getElementById(id).addEventListener("input",renderPreview);
      document.getElementById(id).addEventListener("change",renderPreview);
    });
    return;
  }

  if(t==="hero_multi"){
    a.innerHTML=`<div class="dynamic-box">
      <div class="dynamic-title">英雄カード選択です</div>
      <div class="dynamic-desc">英雄管理に登録されている英雄カードを回答画面に表示します。</div>
      <div class="example-box">例：条件を満たしている英雄にチェック<br>条件：★4以上 かつ 遠征スキルLv5</div>
    </div>`;
    return;
  }

  if(t==="number"){
    a.innerHTML=`<div class="dynamic-box">
      <div class="dynamic-title">数字入力の質問です</div>
      <div class="dynamic-desc">回答者は数字だけ入力します。</div>
    </div>`;
    return;
  }

  a.innerHTML=`<div class="dynamic-box">
    <div class="dynamic-title">文章入力の質問です</div>
    <div class="dynamic-desc">回答者は自由に文章を書きます。</div>
  </div>`;
}

function renderOptionRows(){
  const l=document.getElementById("optionList");
  if(!l)return;
  l.innerHTML=optionValues.map((v,i)=>`
    <div class="option-row">
      <input data-option-index="${i}" value="${escapeAttr(v)}" placeholder="選択肢 ${i+1}">
      <button class="option-remove" type="button" data-remove-option="${i}">×</button>
    </div>
  `).join("");
  document.querySelectorAll("[data-option-index]").forEach(input=>{
    input.addEventListener("input",()=>{
      syncOptionValues();
      renderPreview();
    });
  });
  document.querySelectorAll("[data-remove-option]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      syncOptionValues();
      optionValues.splice(Number(btn.dataset.removeOption),1);
      if(optionValues.length===0)optionValues.push("");
      renderOptionRows();
      renderPreview();
    });
  });
}

function syncOptionValues(){
  const ins=document.querySelectorAll("[data-option-index]");
  if(ins.length)optionValues=Array.from(ins).map(i=>i.value.trim());
}

function getPlaceholderValue(){
  return document.getElementById("placeholder")?.value.trim()||"";
}

function getUnitValue(){
  return document.getElementById("unit")?.value.trim()||"人";
}

function renderSetPreviewRows(){
  const opts=optionValues.map(v=>v.trim()).filter(Boolean);
  return (setItems.length?setItems:[{label:"盾兵舎"}]).map(it=>`
    <div class="set-preview-row">
      <div class="set-preview-label">${escapeHtml(it.label)}</div>
      <div class="fake-input">${escapeHtml(opts[0]||"選択してください")}</div>
    </div>
  `).join("");
}

function renderPreview(){
  syncOptionValues();
  const title=document.getElementById("title")?.value.trim()||"質問タイトル";
  const content=document.getElementById("content")?.value.trim()||"質問内容がここに表示されます";
  const t=getSelectedType();
  const opts=optionValues.map(v=>v.trim()).filter(Boolean);
  const placeholder=getPlaceholderValue();
  let ans="";

  if(t==="single_select"){
    (opts.length?opts:["選択肢1","選択肢2"]).forEach(v=>{
      ans+=`<div class="choice"><span class="fake-radio"></span><span>${escapeHtml(v)}</span></div>`;
    });
  }else if(t==="multi_select"){
    (opts.length?opts:["選択肢1","選択肢2"]).forEach(v=>{
      ans+=`<div class="choice"><span class="fake-check"></span><span>${escapeHtml(v)}</span></div>`;
    });
  }else if(t==="set_select"){
    ans=renderSetPreviewRows();
  }else if(t==="number"){
    ans=`<div class="fake-input">${escapeHtml(placeholder||"数字を入力")}</div>`;
  }else if(t==="number_unit"){
    ans=`<div class="unit-preview"><div class="fake-input">${escapeHtml(placeholder||"数字を入力")}</div><div class="unit-chip">${escapeHtml(getUnitValue())}</div></div>`;
  }else if(t==="time_select"){
    ans=`<div class="fake-input">${escapeHtml(placeholder||"21:00")}</div>`;
  }else if(t==="time_range"){
    ans=`<div class="time-preview"><div class="fake-input">開始</div><div class="time-sep">〜</div><div class="fake-input">終了</div></div>`;
  }else if(t==="time_hm"){
    ans=`<div class="time-preview"><div class="fake-input">時</div><div class="time-sep">:</div><div class="fake-input">分</div></div>`;
  }else if(t==="hero_multi"){
    ans=`<div class="choice"><span class="fake-check"></span><span>英雄カードを表示</span></div>`;
  }else{
    ans=`<div class="fake-input">${escapeHtml(placeholder||"文章を入力")}</div>`;
  }

  const cat=categoryLabel(document.getElementById("category")?.value||"general");
  document.getElementById("answerPreview").innerHTML=`
    <div class="preview-card">
      <div class="preview-title">${escapeHtml(title)}</div>
      <div class="category-badge">${escapeHtml(cat)}</div>
      <div class="preview-body">${escapeHtml(content)}</div>
      ${ans}
    </div>`;
}

async function loadCards(){
  const l=document.getElementById("cardList");
  l.innerHTML=`<div class="empty">読み込み中...</div>`;
  try{
    const r=await fetch(LIST_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({discordId:getDiscordId()})
    });
    const d=await r.json();
    if(!r.ok||!d.ok)throw new Error(d.error||"load_failed");
    if(!d.cards.length){
      l.innerHTML=`<div class="empty">まだ質問カードがありません。</div>`;
      return;
    }
    l.innerHTML=d.cards.map(cardTemplate).join("");
    document.querySelectorAll("[data-edit]").forEach(b=>{
      b.addEventListener("click",()=>fillForm(JSON.parse(decodeURIComponent(b.dataset.edit))));
    });
    document.querySelectorAll("[data-delete]").forEach(b=>{
      b.addEventListener("click",()=>deleteCard(b.dataset.delete));
    });
  }catch(e){
    l.innerHTML=`<div class="empty error">読み込み失敗：${escapeHtml(e.message)}</div>`;
  }
}

function cardTemplate(c){
  const opts=(c.options||[]).join(" / ");
  return `<div class="q-card">
    <div class="q-top">
      <div>
        <div class="q-title">${escapeHtml(c.title||"無題")}</div>
        <div class="q-meta">${typeLabel(c.type)} / ${escapeHtml(categoryLabel(c.category))}</div>
      </div>
      <span class="badge">ストック済み</span>
    </div>
    ${c.description?`<div class="q-desc">${escapeHtml(c.description)}</div>`:""}
    ${opts?`<div class="q-options">選択肢：${escapeHtml(opts)}</div>`:""}
    ${c.setItems?.length?`<div class="q-options">セット項目：${escapeHtml(c.setItems.map(i=>i.label).join(" / "))}</div>`:""}
    ${c.placeholder?`<div class="q-options">入力例：${escapeHtml(c.placeholder)}</div>`:""}
    ${c.unit?`<div class="q-options">単位：${escapeHtml(c.unit)}</div>`:""}
    <div class="q-actions">
      <button class="small-btn edit" data-edit="${encodeURIComponent(JSON.stringify(c))}">編集</button>
      <button class="small-btn delete" data-delete="${escapeAttr(c.id)}">削除</button>
    </div>
  </div>`;
}

async function saveCard(){
  const msg=document.getElementById("msg");
  const btn=document.getElementById("saveBtn");
  msg.className="msg";
  msg.textContent="";
  btn.disabled=true;
  btn.textContent="保存中...";

  const t=getSelectedType();
  syncOptionValues();

  const opts=(t==="single_select"||t==="multi_select"||t==="time_select"||t==="set_select")
    ? optionValues.map(v=>v.trim()).filter(Boolean)
    : [];

  const card={
    id:editingCardId,
    title:document.getElementById("title").value.trim(),
    description:document.getElementById("content").value.trim(),
    type:t,
    options:opts,
    setItems:t==="set_select"?setItems:[],
    setKind:t==="set_select"?inferSetKind():"",
    placeholder:getPlaceholderValue(),
    example:getPlaceholderValue(),
    unit:document.getElementById("unit")?.value.trim()||"",
    timeStep:Number(document.getElementById("timeStep")?.value||30),
    startHour:Number(document.getElementById("startHour")?.value||0),
    endHour:Number(document.getElementById("endHour")?.value||23),
    imageUrl:"",
    saveToProfile:false,
    profileField:"",
    category:document.getElementById("category")?.value||"general",
    enabled:true
  };

  if(!card.title){
    msg.className="msg error";
    msg.textContent="質問タイトルを入力してください。";
    btn.disabled=false;
    btn.textContent="保存する";
    return;
  }

  if(!card.description){
    msg.className="msg error";
    msg.textContent="質問内容を入力してください。";
    btn.disabled=false;
    btn.textContent="保存する";
    return;
  }

  if((t==="single_select"||t==="multi_select"||t==="set_select")&&!card.options.length){
    msg.className="msg error";
    msg.textContent="選択式の場合は、選択肢を1つ以上入力してください。";
    btn.disabled=false;
    btn.textContent="保存する";
    return;
  }

  try{
    const r=await fetch(SAVE_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({discordId:getDiscordId(),card})
    });
    const d=await r.json();
    if(!r.ok||!d.ok)throw new Error(d.error||"save_failed");
    msg.className="msg ok";
    msg.textContent="保存しました。質問ストックに追加されています。";
    resetForm(false);
    await loadCards();
  }catch(e){
    msg.className="msg error";
    msg.textContent="保存失敗："+e.message;
  }finally{
    btn.disabled=false;
    btn.textContent="保存する";
  }
}

function fillForm(c){
  editingCardId=c.id||"";
  document.getElementById("formTitle").textContent="質問を編集する";
  document.getElementById("title").value=c.title||"";
  document.getElementById("content").value=c.description||"";
  const radio=document.querySelector(`input[name='answerType'][value='${c.type||"text"}']`);
  if(radio)radio.checked=true;
  optionValues=(c.options&&c.options.length)?c.options:[""];
  setItems=(c.setItems&&c.setItems.length)?c.setItems:[];
  const cat=document.getElementById("category");
  if(cat)cat.value=c.category||"general";
  refreshTypeUI();
  renderDynamicArea();
  const ph=document.getElementById("placeholder");
  if(ph)ph.value=c.placeholder||c.example||"";
  const unit=document.getElementById("unit");
  if(unit)unit.value=c.unit||"";
  const ts=document.getElementById("timeStep");
  if(ts)ts.value=c.timeStep||30;
  const sh=document.getElementById("startHour");
  if(sh)sh.value=c.startHour??0;
  const eh=document.getElementById("endHour");
  if(eh)eh.value=c.endHour??23;
  renderPreview();
  scrollTo({top:0,behavior:"smooth"});
}

function resetForm(clearMsg=true){
  editingCardId="";
  optionValues=[""];
  setItems=[];
  document.getElementById("formTitle").textContent="新しい質問を作る";
  document.getElementById("title").value="";
  document.getElementById("content").value="";
  const cat=document.getElementById("category");
  if(cat)cat.value="general";
  const ph=document.getElementById("placeholder");
  if(ph)ph.value="";
  const r=document.querySelector("input[name='answerType'][value='single_select']");
  if(r)r.checked=true;
  refreshTypeUI();
  renderDynamicArea();
  renderPreview();
  if(clearMsg)document.getElementById("msg").textContent="";
}

async function deleteCard(id){
  if(!confirm("この質問を削除しますか？"))return;
  try{
    const r=await fetch(DELETE_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({discordId:getDiscordId(),id})
    });
    const d=await r.json();
    if(!r.ok||!d.ok)throw new Error(d.error||"delete_failed");
    await loadCards();
  }catch(e){
    alert("削除失敗："+e.message);
  }
}

function typeLabel(t){
  return {
    single_select:"1つだけ選択",
    multi_select:"複数選択",
    set_select:"セット質問",
    number:"数字で入力",
    number_unit:"数字＋単位",
    time_select:"時間プルダウン",
    time_range:"時間範囲",
    time_hm:"時:分入力",
    hero_multi:"英雄カード選択",
    text:"文章で入力"
  }[t]||t;
}

function categoryLabel(c){
  return {
    general:"自由質問",
    fc:"FC",
    tier:"ティア",
    t12:"T12",
    hero:"英雄育成",
    pet:"ペット",
    power:"戦力",
    time:"参加時間",
    office:"官職予約"
  }[c]||c||"自由質問";
}

function escapeHtml(s){
  return String(s)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function escapeAttr(s){
  return escapeHtml(s);
}

session=getSession();
if(session){
  const level=getPermissionLevel(session);
  if(level<1){
    document.getElementById("app").innerHTML=`<div class="panel"><div class="panel-title">権限がありません</div><p class="sub">質問カード管理はテクニカルマネージャー以上が利用できます。</p><a class="back" href="${ADMIN_URL}">← 管理ページへ戻る</a></div>`;
  }else{
    render();
  }
}
</script>

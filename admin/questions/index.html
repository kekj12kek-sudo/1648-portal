<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>質問カード管理</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100%;background:#070b12;color:#fff;font-family:'Hiragino Sans','Yu Gothic',system-ui,sans-serif}
body{padding:16px;padding-bottom:32px}
.header{position:sticky;top:0;z-index:20;margin:-16px -16px 16px;padding:14px 16px;background:linear-gradient(180deg,rgba(7,11,18,.98),rgba(7,11,18,.86));border-bottom:1px solid rgba(255,255,255,.08);backdrop-filter:blur(10px)}
h1{font-size:20px;color:#c084fc;line-height:1.3}.sub{margin-top:4px;font-size:12px;opacity:.75;line-height:1.7}.back{display:inline-flex;margin-top:12px;color:#93c5fd;text-decoration:none;font-size:12px;font-weight:800}
.panel{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);border-radius:18px;padding:14px;margin-bottom:14px}.panel-title{font-size:16px;font-weight:900;margin-bottom:10px;color:#e9d5ff}
.help-box{border:1px solid rgba(96,165,250,.25);background:rgba(59,130,246,.08);color:#bfdbfe;border-radius:14px;padding:11px 12px;font-size:12px;line-height:1.7;margin-bottom:14px}
label{display:block;font-size:13px;font-weight:900;margin:14px 0 7px;color:#e5e7eb}input,textarea{width:100%;border-radius:13px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);color:#fff;font-size:16px;padding:12px;outline:none;font-family:inherit}textarea{min-height:96px;resize:vertical;line-height:1.6}
.type-grid{display:grid;grid-template-columns:1fr;gap:8px}.type-btn{display:flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);border-radius:14px;padding:12px;cursor:pointer}.type-btn.active{border-color:rgba(192,132,252,.8);background:rgba(126,34,206,.22)}.type-btn input{width:18px;height:18px;flex-shrink:0}.type-name{font-size:14px;font-weight:900}.type-desc{font-size:11px;opacity:.68;margin-top:2px}
.dynamic-box{margin-top:14px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.045);border-radius:16px;padding:13px}.dynamic-title{font-size:14px;font-weight:900;color:#fde68a;margin-bottom:6px}.dynamic-desc{font-size:12px;line-height:1.7;opacity:.78;margin-bottom:10px}.option-list{display:flex;flex-direction:column;gap:8px}.option-row{display:flex;gap:8px;align-items:center}.option-row input{flex:1}.option-remove{width:42px;height:42px;border:none;border-radius:12px;background:rgba(248,113,113,.16);color:#fecaca;font-weight:900;font-size:18px}.add-option{width:100%;margin-top:10px;border:none;border-radius:13px;background:rgba(59,130,246,.18);color:#bfdbfe;font-size:13px;font-weight:900;padding:11px}.example-box{border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.18);border-radius:12px;padding:11px;font-size:12px;line-height:1.7;color:#cbd5e1}
.image-placeholder{border:1px dashed rgba(255,255,255,.25);background:rgba(255,255,255,.04);border-radius:14px;padding:14px;font-size:12px;line-height:1.7;color:#cbd5e1}.btn{width:100%;min-height:52px;margin-top:14px;border:none;border-radius:15px;background:linear-gradient(135deg,#7c3aed,#c084fc);color:#fff;font-size:16px;font-weight:900;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.btn-secondary{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#e5e7eb}.msg{font-size:12px;line-height:1.7;margin-top:10px;text-align:center}.ok{color:#86efac}.error{color:#fca5a5}
.card-list{display:flex;flex-direction:column;gap:10px}.q-card{border:1px solid rgba(255,255,255,.13);background:linear-gradient(135deg,rgba(30,41,59,.95),rgba(15,23,42,.95));border-radius:16px;padding:13px}.q-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.q-title{font-size:15px;font-weight:900;line-height:1.4}.q-meta{font-size:10px;opacity:.65;margin-top:4px}.q-desc{font-size:12px;line-height:1.6;opacity:.75;margin-top:8px}.q-options{font-size:11px;line-height:1.6;margin-top:8px;color:#bfdbfe}.q-actions{display:flex;gap:8px;margin-top:10px}.small-btn{border:none;border-radius:999px;padding:8px 11px;font-size:11px;font-weight:900;cursor:pointer}.edit{background:rgba(59,130,246,.18);color:#bfdbfe}.delete{background:rgba(248,113,113,.16);color:#fecaca}.badge{display:inline-block;border-radius:999px;padding:4px 7px;font-size:10px;font-weight:900;background:rgba(255,255,255,.1);color:#e5e7eb;white-space:nowrap}.empty{font-size:13px;line-height:1.7;opacity:.72;text-align:center;padding:20px 8px}
@media(min-width:700px){.type-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body><div id="app"></div>
<script>
const LOGIN_URL="https://discord.com/oauth2/authorize?client_id=1514478819799470080&response_type=code&redirect_uri=https%3A%2F%2Fkekj12kek-sudo.github.io%2F1648-portal%2Fauth%2Fcallback%2F&scope=identify";
const ADMIN_URL="/1648-portal/admin/";
const SAVE_URL="https://us-central1-yoyaku-4ec7c.cloudfunctions.net/saveQuestionCard";
const LIST_URL="https://us-central1-yoyaku-4ec7c.cloudfunctions.net/listQuestionCards";
const DELETE_URL="https://us-central1-yoyaku-4ec7c.cloudfunctions.net/deleteQuestionCard";
let session=null;let editingCardId="";let optionValues=[""];
function getSession(){const raw=localStorage.getItem("discord_user");if(!raw){window.location.replace(LOGIN_URL);return null}try{const data=JSON.parse(raw);if(!data.ok){localStorage.removeItem("discord_user");window.location.replace(LOGIN_URL);return null}if(data.status==="pending_profile"){window.location.replace("/1648-portal/profile-setup/");return null}if(data.status!=="active"){localStorage.removeItem("discord_user");window.location.replace(LOGIN_URL);return null}return data}catch(e){localStorage.removeItem("discord_user");window.location.replace(LOGIN_URL);return null}}
function getDiscordId(){return session?.user?.discordId||session?.discord?.id||session?.discordId||""}
function getPermissionLevel(data){const discordId=data?.user?.discordId||data?.discord?.id||data?.discordId||"";if(discordId==="795152243883114527")return 3;const role=data?.role||data?.user?.role||"member";const levelMap={developer:3,manager:2,technical:1,member:0};return levelMap[role]??0}
function render(){document.getElementById("app").innerHTML=`<div class="header"><h1>質問カード管理</h1><div class="sub">よく使う質問をストックします。<br>アンケート作成時に、この一覧から選んで使えます。</div><a class="back" href="${ADMIN_URL}">← 管理ページへ戻る</a></div><div class="panel"><div class="panel-title" id="formTitle">新しい質問を作る</div><div class="help-box">回答方式を選ぶと、必要な入力欄だけ表示されます。<br>管理者は質問内容だけ作ればOKです。</div><label for="title">質問名</label><input id="title" placeholder="例：T12状況"><label for="description">説明文</label><textarea id="description" placeholder="例：現在のT12研究状況を選択してください"></textarea><label>回答方式</label><div class="type-grid" id="typeGrid">${typeRadio("single_select","1つだけ選択","選択肢の中から1つだけ選ばせる")}${typeRadio("multi_select","複数選択","当てはまるものを複数選ばせる")}${typeRadio("number","数字で入力","出征数・容量など数字だけ入力させる")}${typeRadio("text","文章で入力","自由コメントや補足を書かせる")}</div><div id="dynamicArea"></div><label>画像</label><div class="image-placeholder">画像アップロードは次の工程で追加します。<br>今後はスマホ/PCのライブラリから画像を選ぶだけで登録できるようにします。</div><button class="btn" id="saveBtn">保存する</button><button class="btn btn-secondary" id="resetBtn" type="button">入力をリセット</button><div id="msg" class="msg"></div></div><div class="panel"><div class="panel-title">質問ストック</div><div id="cardList" class="card-list"><div class="empty">読み込み中...</div></div></div>`;document.querySelectorAll("input[name='answerType']").forEach(r=>{r.addEventListener("change",()=>{refreshTypeUI();renderDynamicArea()})});document.getElementById("saveBtn").addEventListener("click",saveCard);document.getElementById("resetBtn").addEventListener("click",resetForm);refreshTypeUI();renderDynamicArea();loadCards()}
function typeRadio(value,title,desc){return `<label class="type-btn" data-type-wrap="${value}"><input type="radio" name="answerType" value="${value}" ${value==="single_select"?"checked":""}><div><div class="type-name">${title}</div><div class="type-desc">${desc}</div></div></label>`}
function getSelectedType(){return document.querySelector("input[name='answerType']:checked")?.value||"text"}
function refreshTypeUI(){const type=getSelectedType();document.querySelectorAll("[data-type-wrap]").forEach(el=>{el.classList.toggle("active",el.dataset.typeWrap===type)})}
function renderDynamicArea(){const type=getSelectedType();const area=document.getElementById("dynamicArea");if(!area)return;if(type==="single_select"||type==="multi_select"){area.innerHTML=`<div class="dynamic-box"><div class="dynamic-title">選択肢を作る</div><div class="dynamic-desc">回答者が選ぶ項目です。<br>例：未開放 / 兵のみ / スキルまで / カンスト</div><div id="optionList" class="option-list"></div><button class="add-option" type="button" id="addOptionBtn">＋ 選択肢を追加</button></div>`;renderOptionRows();document.getElementById("addOptionBtn").addEventListener("click",()=>{syncOptionValues();optionValues.push("");renderOptionRows()});return}if(type==="number"){area.innerHTML=`<div class="dynamic-box"><div class="dynamic-title">数字入力の質問です</div><div class="dynamic-desc">回答者は数字だけ入力します。選択肢は不要です。<br>質問名や説明文に単位を書いてください。</div><div class="example-box">例：最大出征数<br>説明文：現在の最大出征数を入力してください。例：197710</div></div>`;return}area.innerHTML=`<div class="dynamic-box"><div class="dynamic-title">文章入力の質問です</div><div class="dynamic-desc">回答者は自由に文章を書きます。選択肢は不要です。<br>補足・意見・備考などに使います。</div><div class="example-box">例：補足があれば記入してください<br>回答例：22時以降なら参加できます</div></div>`}
function renderOptionRows(){const list=document.getElementById("optionList");if(!list)return;list.innerHTML=optionValues.map((value,index)=>`<div class="option-row"><input data-option-index="${index}" value="${escapeAttr(value)}" placeholder="選択肢 ${index+1}"><button class="option-remove" type="button" data-remove-option="${index}">×</button></div>`).join("");document.querySelectorAll("[data-remove-option]").forEach(btn=>{btn.addEventListener("click",()=>{syncOptionValues();const idx=Number(btn.dataset.removeOption);optionValues.splice(idx,1);if(optionValues.length===0)optionValues.push("");renderOptionRows()})})}
function syncOptionValues(){const inputs=document.querySelectorAll("[data-option-index]");if(!inputs.length)return;optionValues=Array.from(inputs).map(i=>i.value.trim())}
async function loadCards(){const list=document.getElementById("cardList");list.innerHTML=`<div class="empty">読み込み中...</div>`;try{const res=await fetch(LIST_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({discordId:getDiscordId()})});const data=await res.json();if(!res.ok||!data.ok)throw new Error(data.error||"load_failed");if(!data.cards.length){list.innerHTML=`<div class="empty">まだ質問カードがありません。</div>`;return}list.innerHTML=data.cards.map(cardTemplate).join("");document.querySelectorAll("[data-edit]").forEach(btn=>btn.addEventListener("click",()=>fillForm(JSON.parse(decodeURIComponent(btn.dataset.edit)))));document.querySelectorAll("[data-delete]").forEach(btn=>btn.addEventListener("click",()=>deleteCard(btn.dataset.delete)))}catch(err){list.innerHTML=`<div class="empty error">読み込み失敗：${escapeHtml(err.message)}</div>`}}
function cardTemplate(card){const options=(card.options||[]).join(" / ");return `<div class="q-card"><div class="q-top"><div><div class="q-title">${escapeHtml(card.title||"無題")}</div><div class="q-meta">${typeLabel(card.type)}</div></div><span class="badge">ストック済み</span></div>${card.description?`<div class="q-desc">${escapeHtml(card.description)}</div>`:""}${options?`<div class="q-options">選択肢：${escapeHtml(options)}</div>`:""}<div class="q-actions"><button class="small-btn edit" data-edit="${encodeURIComponent(JSON.stringify(card))}">編集</button><button class="small-btn delete" data-delete="${escapeAttr(card.id)}">削除</button></div></div>`}
async function saveCard(){const msg=document.getElementById("msg");const saveBtn=document.getElementById("saveBtn");msg.className="msg";msg.textContent="";saveBtn.disabled=true;saveBtn.textContent="保存中...";const type=getSelectedType();syncOptionValues();const options=(type==="single_select"||type==="multi_select")?optionValues.map(v=>v.trim()).filter(Boolean):[];const card={id:editingCardId,title:document.getElementById("title").value.trim(),description:document.getElementById("description").value.trim(),type,options,imageUrl:"",saveToProfile:false,profileField:"",category:"general",enabled:true};if(!card.title){msg.className="msg error";msg.textContent="質問名を入力してください。";saveBtn.disabled=false;saveBtn.textContent="保存する";return}if((type==="single_select"||type==="multi_select")&&card.options.length===0){msg.className="msg error";msg.textContent="選択式の場合は、選択肢を1つ以上入力してください。";saveBtn.disabled=false;saveBtn.textContent="保存する";return}try{const res=await fetch(SAVE_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({discordId:getDiscordId(),card})});const data=await res.json();if(!res.ok||!data.ok)throw new Error(data.error||"save_failed");msg.className="msg ok";msg.textContent="保存しました。質問ストックに追加されています。";resetForm(false);await loadCards()}catch(err){msg.className="msg error";msg.textContent="保存失敗："+err.message}finally{saveBtn.disabled=false;saveBtn.textContent="保存する"}}
function fillForm(card){editingCardId=card.id||"";document.getElementById("formTitle").textContent="質問を編集する";document.getElementById("title").value=card.title||"";document.getElementById("description").value=card.description||"";const radio=document.querySelector(`input[name='answerType'][value='${card.type||"text"}']`);if(radio)radio.checked=true;optionValues=(card.options&&card.options.length)?card.options:[""];refreshTypeUI();renderDynamicArea();window.scrollTo({top:0,behavior:"smooth"})}
function resetForm(clearMsg=true){editingCardId="";optionValues=[""];document.getElementById("formTitle").textContent="新しい質問を作る";document.getElementById("title").value="";document.getElementById("description").value="";const radio=document.querySelector("input[name='answerType'][value='single_select']");if(radio)radio.checked=true;refreshTypeUI();renderDynamicArea();if(clearMsg)document.getElementById("msg").textContent=""}
async function deleteCard(id){if(!confirm("この質問を削除しますか？"))return;try{const res=await fetch(DELETE_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({discordId:getDiscordId(),id})});const data=await res.json();if(!res.ok||!data.ok)throw new Error(data.error||"delete_failed");await loadCards()}catch(err){alert("削除失敗："+err.message)}}
function typeLabel(type){return {single_select:"1つだけ選択",multi_select:"複数選択",number:"数字で入力",text:"文章で入力"}[type]||type}
function escapeHtml(str){return String(str).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function escapeAttr(str){return escapeHtml(str)}
session=getSession();if(session){const level=getPermissionLevel(session);if(level<1){document.getElementById("app").innerHTML=`<div class="panel"><div class="panel-title">権限がありません</div><p class="sub">質問カード管理はテクニカルマネージャー以上が利用できます。</p><a class="back" href="${ADMIN_URL}">← 管理ページへ戻る</a></div>`}else{render()}}
</script>
</body></html>

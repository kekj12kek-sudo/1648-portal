<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>1648 Portal プロフィール登録</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#070b12;color:#fff;font-family:'Hiragino Sans','Yu Gothic',system-ui,sans-serif}
body{padding:20px;display:flex;align-items:center;justify-content:center;min-height:100vh}
.box{width:100%;max-width:420px}
h1{font-size:19px;color:#facc15;margin-bottom:6px}
.sub{font-size:12px;color:#94a3b8;line-height:1.7;margin-bottom:20px}
.card{background:linear-gradient(135deg,rgba(30,41,59,.96),rgba(15,23,42,.96));border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:18px}
.field-label{font-size:11px;color:#94a3b8;font-weight:900;margin:14px 0 6px}
.field-label:first-child{margin-top:0}
.field-hint{font-size:10px;color:#64748b;margin-top:5px;line-height:1.6}
.field-input{width:100%;height:46px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:#0f172a;color:#fff;padding:0 12px;font:inherit}
.btn{width:100%;height:48px;border-radius:12px;border:none;font:inherit;font-weight:900;cursor:pointer;margin-top:20px}
.btn-primary{background:#facc15;color:#111827}
.btn-primary:disabled{opacity:.5;cursor:default}
.msg{font-size:12px;margin-top:12px;text-align:center;line-height:1.6}
.msg.error{color:#fca5a5}
.msg.success{color:#4ade80}
.note{font-size:11px;color:#64748b;margin-top:16px;line-height:1.7;text-align:center}
.note a{color:#93c5fd}
</style>
</head>
<body>
<div class="box">
  <h1>1648 Portal プロフィール登録</h1>
  <div class="sub">
    Discordの通常ログインがうまくいかない方向けの登録方法です。<br>
    同盟の管理者から「認証コード」を個別に受け取ってから入力してください。
  </div>
  <div class="card">
    <div class="field-label">認証コード</div>
    <input class="field-input" id="authCode" placeholder="管理者から伝えられたコード" inputmode="numeric">
    <div class="field-hint">同盟の管理者があなたのDiscordアカウントを確認した上で発行するコードです。ご自身では調べず、管理者から受け取った通りに入力してください。</div>

    <div class="field-label">プレイヤー名</div>
    <input class="field-input" id="playerName" placeholder="ゲーム内表示名">

    <div class="field-label">ゲームID</div>
    <input class="field-input" id="gameId" placeholder="例: 201334956">

    <div class="field-label">所属同盟</div>
    <input class="field-input" id="alliance" placeholder="例: LEO">

    <button class="btn btn-primary" id="submitBtn" onclick="submitRegister()">登録してPortalへ進む</button>
    <div class="msg" id="msgArea"></div>
  </div>
  <div class="note">
    通常通りDiscordでログインできる場合は、<a href="/1648-portal/">こちら</a>からログインしてください。
  </div>
</div>

<script>
const FN_BASE = "https://us-central1-yoyaku-4ec7c.cloudfunctions.net";
const PORTAL_URL = "/1648-portal/";

async function submitRegister(){
  const authCode = document.getElementById("authCode").value.trim();
  const playerName = document.getElementById("playerName").value.trim();
  const gameId = document.getElementById("gameId").value.trim();
  const alliance = document.getElementById("alliance").value.trim();
  const msgArea = document.getElementById("msgArea");
  const btn = document.getElementById("submitBtn");

  msgArea.className = "msg";
  msgArea.textContent = "";

  if(!authCode || !playerName || !gameId || !alliance){
    msgArea.className = "msg error";
    msgArea.textContent = "すべての項目を入力してください。";
    return;
  }

  btn.disabled = true;
  btn.textContent = "登録中...";

  try{
    const res = await fetch(`${FN_BASE}/registerManualUser`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({discordId: authCode, playerName, gameId, alliance})
    });
    const data = await res.json();

    if(!res.ok || !data.ok){
      if(data && data.error === "not_1648_member"){
        msgArea.className = "msg error";
        msgArea.textContent = "認証コードが確認できませんでした。同盟の管理者にご確認ください。";
      }else if(data && data.error === "invalid_discord_id"){
        msgArea.className = "msg error";
        msgArea.textContent = "認証コードの形式が正しくありません。もう一度ご確認ください。";
      }else{
        msgArea.className = "msg error";
        msgArea.textContent = "登録に失敗しました。時間をおいて再度お試しください。";
      }
      btn.disabled = false;
      btn.textContent = "登録してPortalへ進む";
      return;
    }

    localStorage.setItem("discord_user", JSON.stringify(data));
    msgArea.className = "msg success";
    msgArea.textContent = "登録できました。Portalへ移動します...";
    setTimeout(()=>{ location.href = PORTAL_URL; }, 800);
  }catch(e){
    msgArea.className = "msg error";
    msgArea.textContent = "通信に失敗しました。時間をおいて再度お試しください。";
    btn.disabled = false;
    btn.textContent = "登録してPortalへ進む";
  }
}
</script>
</body>
</html>

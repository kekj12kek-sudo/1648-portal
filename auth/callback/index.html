<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1648 Alliance Portal</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    text-align:center;
}

.card{
    max-width:500px;
    padding:30px;
}

.loader{
    width:40px;
    height:40px;
    border:4px solid #444;
    border-top:4px solid #f7b500;
    border-radius:50%;
    margin:20px auto;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

a{
    color:#4da3ff;
}
</style>
</head>
<body>

<div class="card">
    <h1>1648 Alliance Portal</h1>
    <div class="loader"></div>
    <p>Discord認証を確認しています...</p>
</div>

<script>
const FUNCTION_URL = "https://us-central1-yoyaku-4ec7c.cloudfunctions.net/exchangeDiscordCode";
const HOME_URL = "/1648-portal/";

const params = new URLSearchParams(window.location.search);
const code = params.get("code");

function showError(title, message){
    document.body.innerHTML = `
        <div class="card">
            <h2>${title}</h2>
            <p>${message}</p>
            <a href="${HOME_URL}">ホームへ戻る</a>
        </div>
    `;
}

async function main(){
    if (!code) {
        showError("認証失敗", "Discord認証コードが見つかりません。");
        return;
    }

    try {
        const response = await fetch(FUNCTION_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ code })
        });

        const data = await response.json();

        if (!response.ok || !data.ok) {
            throw new Error(data.message || data.error || "Discord認証に失敗しました。");
        }

        localStorage.setItem("discord_user", JSON.stringify(data));

        if (data.status === "pending_profile") {
            localStorage.setItem("portal_needs_profile", "true");
        } else {
            localStorage.removeItem("portal_needs_profile");
        }

        window.location.href = HOME_URL;

    } catch (error) {
        console.error(error);
        showError("認証失敗", error.message || "認証処理中にエラーが発生しました。");
    }
}

main();
</script>

</body>
</html>
